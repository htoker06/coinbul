<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minik Adımlar Planlayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Düzen: solda pastel boya kutusu gibi menü, sağda "pano" — plan kâğıtları ve renkli etkinlik kartları. Telefonda menü alt çubuğa iner. */
:root{
  --bg:#F1F6F5;           /* hafif nane tonlu zemin */
  --paper:#FFFFFF;
  --paper-2:#F7FAF9;
  --ink:#1C2840;          /* lacivert mürekkep */
  --ink-2:#55617A;
  --line:#DCE5E4;
  --accent:#2C6FD6;       /* mavi pastel boya */
  --accent-ink:#FFFFFF;
  --sun:#F4B23A;
  --soft:#E7EFFC;
  --ok:#2F9E6A;
  --warn:#D9822B;
  --c-ta:#E0517A; --c-ma:#2C6FD6; --c-fa:#2F9E6A; --c-sa:#E9792E;
  --c-hsa:#14A0A6; --c-sna:#8B5AD6; --c-msa:#D69A12;
  --shadow:0 1px 2px rgba(28,40,64,.06),0 6px 18px rgba(28,40,64,.07);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121822; --paper:#1A2230; --paper-2:#1F2938; --ink:#E9EEF7; --ink-2:#A3AEC2; --line:#2C3748;
  --accent:#6EA2F5; --accent-ink:#0F1622; --sun:#F2BE5B; --soft:#22324B; --ok:#55C792; --warn:#F0A256;
  --c-ta:#F27A9C; --c-ma:#6EA2F5; --c-fa:#55C792; --c-sa:#F39A5B; --c-hsa:#3CC5CA; --c-sna:#AE88EC; --c-msa:#E9B73E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121822; --paper:#1A2230; --paper-2:#1F2938; --ink:#E9EEF7; --ink-2:#A3AEC2; --line:#2C3748;
  --accent:#6EA2F5; --accent-ink:#0F1622; --sun:#F2BE5B; --soft:#22324B; --ok:#55C792; --warn:#F0A256;
  --c-ta:#F27A9C; --c-ma:#6EA2F5; --c-fa:#55C792; --c-sa:#F39A5B; --c-hsa:#3CC5CA; --c-sna:#AE88EC; --c-msa:#E9B73E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.12rem} h4{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--ink-2)}

/* ---------- Kabuk ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:42px;height:42px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.2rem;line-height:1}
.brand span{display:block;font-size:.75rem;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--ink-2);text-align:left}
.nav button svg{width:22px;height:22px;flex:none}
.nav button:hover{background:var(--paper-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--accent)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--ink-2);padding:0 8px}
.main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:24px 60px}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head p{max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--c-ta);color:var(--c-ta)}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:transparent;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--paper-2);color:var(--ink)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:800;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],select,textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink)}
.chip.code{font-variant-numeric:tabular-nums}
.chip.alan{background:color-mix(in srgb,var(--ac) 14%,var(--paper));border-color:color-mix(in srgb,var(--ac) 40%,var(--line));color:color-mix(in srgb,var(--ac) 75%,var(--ink))}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .x{opacity:.6;cursor:pointer}

/* ---------- Tema bannerı ---------- */
.banner{position:relative;overflow:hidden;border-radius:20px;background:var(--th);color:#fff;padding:26px 26px 30px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;isolation:isolate}
.banner::before{content:"";position:absolute;inset:auto -10% -55% -10%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);z-index:-1}
.banner svg.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:60px;z-index:-1}
.banner .eyebrow{font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.banner h1,.banner h2{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.banner p{max-width:58ch;opacity:.95;font-weight:600}
.floaters{position:absolute;right:10px;top:8px;bottom:8px;width:min(46%,380px);z-index:-1;pointer-events:none}
.floaters span{position:absolute;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));line-height:1}
.em-flag{display:inline-block;width:1.25em;height:.84em;vertical-align:-.08em}

/* ---------- Etkinlik kartları ---------- */
.act{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.act-vis{position:relative;height:104px;background:color-mix(in srgb,var(--ac) 18%,var(--paper));display:flex;align-items:center;justify-content:center;gap:6px;font-size:2.4rem;overflow:hidden}
.act-vis::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:radial-gradient(circle at 10px -2px,transparent 9px,var(--paper) 10px) repeat-x;background-size:20px 10px}
.act-vis span:nth-child(2){font-size:3.2rem;transform:translateY(-4px)}
.act-vis span:nth-child(1){transform:rotate(-10deg)}
.act-vis span:nth-child(3){transform:rotate(9deg)}
.act-vis .alan-badge{position:absolute;left:10px;top:10px;font-size:.72rem;font-weight:800;background:var(--ac);color:#fff;padding:3px 9px;border-radius:999px;letter-spacing:.02em;transform:none}
.act-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.act-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--ink-2);font-weight:700}
.act-sum{font-size:.9rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act-mat{display:flex;flex-wrap:wrap;gap:4px}
.act-mat span{font-size:1.15rem;background:var(--paper-2);border-radius:8px;padding:1px 5px}
.act-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}

/* ---------- Ana sayfa ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-family:var(--f-display);font-size:1.9rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);cursor:pointer}
.quick button:hover{border-color:var(--accent)}
.quick .q-em{font-size:1.8rem}
.quick b{font-family:var(--f-display);font-size:1.02rem}

/* ---------- Günlük akış ---------- */
.flow{display:flex;flex-direction:column;gap:0}
.flow-step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.flow-step::before{content:"";position:absolute;left:27px;top:52px;bottom:0;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.flow-step:last-child::before{display:none}
.flow-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--fc) 16%,var(--paper));color:var(--fc);border:2px solid color-mix(in srgb,var(--fc) 35%,transparent)}
.flow-ic svg{width:30px;height:30px}
.flow-body{min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.flow-body h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow-body h3 small{font-family:var(--f-body);font-size:.75rem;font-weight:700;color:var(--ink-2)}
.flow-body textarea{min-height:58px}

.plan-act{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.plan-act-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:color-mix(in srgb,var(--ac) 12%,var(--paper))}
.plan-act-em{font-size:1.9rem;letter-spacing:-.15em;white-space:nowrap}
.plan-act-head h4{font-size:1.02rem}
.plan-act-body{padding:12px 14px;display:grid;gap:10px}
.plan-act-body ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.mini-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-bottom:1px solid var(--line)}
.sheet-head div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.sheet-head div:last-child{border-right:0}
.sheet-head b{display:block;font-size:.95rem}
.sec{padding:18px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec:last-child{border-bottom:0}
.sec-title{display:flex;align-items:center;gap:10px}
.sec-title .num{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:.82rem;flex:none}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 14px;align-items:start}
.kv>dt{font-weight:800;font-size:.85rem;color:var(--ink-2);padding-top:3px}
.kv>dd{margin:0;min-width:0}
.outcome{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.outcome:last-child{border-bottom:0}

/* ---------- Yıllık ---------- */
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mcard-top{background:var(--th);color:#fff;padding:14px 16px 18px;position:relative;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;isolation:isolate}
.mcard-top .big{position:absolute;right:10px;top:6px;font-size:2.6rem;z-index:-1;opacity:.95}
.mcard-top .big span{display:inline-block}
.mcard-top .m{font-weight:800;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.mcard-top h3{color:#fff;font-size:1.25rem}
.mcard-body{padding:14px 16px;display:grid;gap:10px;flex:1}
.wk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-size:.88rem}
.wk .n{font-size:.7rem;font-weight:800;color:var(--ink-2);background:var(--paper-2);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.days-list{display:grid;gap:3px;font-size:.84rem}
.days-list li{list-style:none}
.days-list ul{margin:0;padding:0}
.mcard-foot{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}

/* ---------- Aylık ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.72rem;font-weight:800;color:var(--ink-2);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.cal button.day{min-height:84px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal button.day:hover{border-color:var(--accent)}
.cal .day.out{opacity:.35}
.cal .day.we{background:var(--paper-2)}
.cal .day.today{border:2px solid var(--accent)}
.cal .day .dn{font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem}
.cal .day .de{font-size:1.05rem;line-height:1.1;overflow:hidden;white-space:nowrap}
.cal .day .dt{font-size:.66rem;color:var(--c-ta);font-weight:800;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.week{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.week-top{background:color-mix(in srgb,var(--th) 85%,#000 0%);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.week-top .em{font-size:1.6rem;white-space:nowrap}
.week-body{padding:12px 14px;display:grid;gap:8px;font-size:.88rem;flex:1}
.alan-block{border-left:4px solid var(--ac);padding:4px 0 4px 12px;display:grid;gap:6px}

/* ---------- Üretici ---------- */
.gen-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;align-items:end}
.alan-pick{display:flex;flex-wrap:wrap;gap:6px}
.alan-pick button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.alan-pick button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}

/* ---------- Modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,34,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--paper);border-radius:20px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);z-index:1}
.modal-body{padding:18px;display:grid;gap:16px}
.detail-vis{border-radius:16px;height:150px;font-size:3.6rem}
.detail-vis::after{display:none}
[contenteditable="true"]{border-radius:6px;padding:1px 4px;margin:-1px -4px}
[contenteditable="true"]:hover{background:var(--paper-2)}
[contenteditable="true"]:focus{outline:2px solid var(--accent);background:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--ink-2)}
.empty .em{font-size:2.4rem}
.note{font-size:.82rem;color:var(--ink-2);background:var(--paper-2);border-radius:10px;padding:10px 12px;border:1px dashed var(--line)}
table.otbl{width:100%;border-collapse:collapse;font-size:.88rem}
.otbl td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
.otbl input{padding:5px 8px}
.tbl-wrap{overflow-x:auto}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:40;gap:0}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between;gap:2px}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.62rem;flex:1;align-items:center;text-align:center;border-radius:10px}
  .main{padding-bottom:110px}
  .today-grid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv>dt{padding-top:6px}
  .cal button.day{min-height:58px;padding:4px}
  .cal .day .dt{display:none}
  .floaters{opacity:.55}
  h1{font-size:1.6rem}
}
@media (max-width:480px){.stat-row{grid-template-columns:repeat(3,minmax(0,1fr))}.stat b{font-size:1.4rem}.cal{gap:3px}.cal .day .de{font-size:.8rem}}
@media (prefers-reduced-motion:no-preference){
  .act,.mcard{transition:transform .15s ease,box-shadow .15s ease}
  .act:hover,.mcard:hover{transform:translateY(-2px)}
}
@media print{
  .side,.toolbar,.no-print,.act-actions,.btn,.icon-btn{display:none!important}
  .app{display:block} .main{padding:0} body{background:#fff}
  .panel,.sheet,.plan-act{break-inside:avoid}
  textarea{border:0;resize:none;padding:0}
}
/* ---------- Program biçimi (MEB plan görünümü) ---------- */
.hier{display:grid;gap:3px;font-size:.9rem}
.h-alan{font-weight:800;letter-spacing:.05em;font-size:.8rem;color:color-mix(in srgb,var(--ac) 80%,var(--ink));margin-top:8px;padding-bottom:2px;border-bottom:2px solid color-mix(in srgb,var(--ac) 35%,transparent)}
.h-alan:first-child{margin-top:0}
.h-grp{font-weight:800;margin-top:4px}
.h-out{padding-left:12px;font-weight:600}
.h-sub{padding-left:24px;color:var(--ink)}
.h-sub b,.h-out b{font-variant-numeric:tabular-nums;white-space:nowrap}
.code-tag{font-size:.8em;font-weight:800;color:var(--accent);white-space:nowrap;margin-left:4px}
ul.bul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.sheet-title{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;padding:12px 18px;background:var(--paper-2);border-bottom:1px solid var(--line);align-items:baseline}
.sheet-title b{font-family:var(--f-display);letter-spacing:.06em;font-size:1.05rem}
.sheet-title span{font-size:.85rem;color:var(--ink-2)}
.sec-title .btn{margin-left:auto}
.sec-title{flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent);font-weight:700;margin-top:6px}
table.ctrl{border-collapse:collapse;font-size:.82rem;min-width:760px;width:100%}
.ctrl th,.ctrl td{border:1px solid var(--line);padding:5px 6px;text-align:center;vertical-align:top}
.ctrl th{background:var(--paper-2);font-size:.75rem;letter-spacing:.04em}
.ctrl td.sticky,.ctrl th.sticky{text-align:left;position:sticky;left:0;background:var(--paper);min-width:220px;max-width:340px}
.ctrl tr.sec-row td{background:var(--soft);color:var(--accent);font-weight:800;text-align:left;letter-spacing:.05em;font-size:.75rem}
.tick{color:var(--ok);font-weight:800;font-size:1rem}
.pick-list{display:grid;gap:12px}
.pick-out{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.pick-head{font-size:.9rem;margin-bottom:2px}
.pick-sub{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:.88rem;padding:3px 4px;border-radius:8px;cursor:pointer}
.pick-sub:hover{background:var(--paper-2)}
.pick-sub input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.prog-list{display:grid;gap:6px}
.prog-item{border:1px solid var(--line);border-radius:10px;padding:8px 12px;border-left:4px solid var(--ac)}
.prog-item summary{color:var(--ink);font-weight:600;margin:0}
@media print{details:not([open]){display:none}.sheet-title{background:none}}
/* ---------- Anekdot (EK-2) ---------- */
:root{--ek2:#F4E3DC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ek2:#3A2A26}}
:root[data-theme="dark"]{--ek2:#3A2A26}
.anek-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.ek2{display:grid;border-top:1px solid var(--line)}
.ek2-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);border-bottom:1px solid var(--line)}
.ek2-row>span{padding:10px 14px;font-weight:700;font-size:.88rem;border-right:1px solid var(--line);display:flex;align-items:center}
.ek2-row input{border:0;border-radius:0;padding:10px 14px;background:transparent}
.ek2-head{background:var(--ek2);padding:10px 14px;font-weight:800;font-size:.9rem;border-bottom:1px solid var(--line);display:grid;gap:2px}
.ek2-head small{font-weight:600;color:var(--ink-2);font-size:.78rem}
.ek2>textarea,.ek2-body textarea{border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:110px;padding:12px 14px}
.ek2-body{display:grid;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ek2-body textarea{border:1.5px dashed var(--line);border-radius:10px;min-height:60px}
.anek-card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c-ta);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
@media (max-width:900px){.anek-grid{grid-template-columns:minmax(0,1fr)}.nav button{font-size:.56rem}.ek2-row{grid-template-columns:minmax(0,1fr)}.ek2-row>span{border-right:0;padding-bottom:0}}
/* ---------- Sınıf seçici ve rapor ---------- */
.class-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;align-self:flex-start;max-width:100%}
.class-bar select{width:auto;max-width:100%;border-radius:999px;padding:5px 10px;font-weight:700}
.age-pill{font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.age-pill[data-age="36-48 ay"]{background:color-mix(in srgb,var(--c-ta) 16%,var(--paper));color:var(--c-ta)}
.age-pill[data-age="48-60 ay"]{background:color-mix(in srgb,var(--c-fa) 16%,var(--paper));color:var(--c-fa)}
.rap-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.rap-t{font-size:.9rem;min-width:0}
.rap-b{display:flex;flex-wrap:wrap;gap:4px}
.rap-b .chip{cursor:pointer}
.rap-b .st-g[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.rap-b .st-d[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#1C2840}
.rap-b .st-s[aria-pressed="true"]{background:var(--c-ta);border-color:var(--c-ta);color:#fff}
button.chip.olcut{text-align:left;font-weight:600;white-space:normal}
@media (max-width:640px){.rap-row{grid-template-columns:minmax(0,1fr)}.class-bar{border-radius:14px}}
</style>

 ay":[["TADB.1","TA","Dinleyecekleri / izleyecekleri şiir, hikâye, tekerleme, video, tiyatro, animasyon gibi materyalleri yönetebilme",[["a","Dinleyecekleri / izleyecekleri materyalleri seçer."],["b","Seçilen materyalleri dinler / izler."]]],["TADB.2","TA","Dinledikleri / izledikleri şiir, hikâye, tekerleme, video, tiyatro, animasyon gibi materyaller ile ilgili yeni anlamlar oluşturabilme",[["a","Dinledikleri / izledikleri materyaller ile ön bilgileri arasında bağlantı kurar."],["b","Dinledikleri / izledikleri materyaller hakkındaki tahminini söyler."],["c","Dinledikleri / izledikleri materyallere ilişkin çıkarım yapar."],["ç","Dinledikleri / izledikleri materyalleri özelliklerine göre karşılaştırır."],["d","Dinledikleri / izledikleri materyalleri özelliklerine göre sınıflandırır."],["e","Dinledikleri / izledikleri hakkında onaylama / reddetme gibi uygun tepkiler verir."]]],["TADB.3","TA","Dinledikleri / izledikleri şiir, hikâye, tekerleme, video, tiyatro, animasyon gibi materyalleri çözümleyebilme",[["a","Dinledikleri / izledikleri materyalleri oluşturan unsurları belirler."],["b","Dinledikleri / izledikleri materyalleri oluşturan unsurlar arasındaki ilişkileri belirler."]]],["TADB.4","TA","Dinledikleri / izledikleri şiir, hikâye, tekerleme, video, tiyatro, animasyon gibi materyalleri değerlendirebilme",[["a","Dinledikleri / izledikleri materyallere ilişkin duygu ve düşüncelerini ifade eder."],["b","Dinleme / izleme ortamını değerlendirir."]]],["TAOB.1","TA","Resimli öykü kitabı, dijital içerikler, afiş, broşür gibi görsel okuma materyallerini seçebilme",[["a","Görsel okuma materyallerini inceler."],["b","Görsel okuma materyallerini seçer."]]],["TAOB.2","TA","Resimli öykü kitabı, dijital içerikler, afiş, broşür gibi görsel okuma materyallerinden anlamlar oluşturabilme",[["a","Görsel okuma materyali ile ön bilgileri arasında ilişki kurar."],["b","Görsellerden hareketle metinle ilgili tahminde bulunur."],["c","Görsel okuma materyallerinde yer alan bilgilerden yararlanarak çıkarım yapar."],["ç","Görsel okuma materyallerini özelliklerine göre karşılaştırır."],["d","Görsel okuma materyallerini özelliklerine göre sınıflandırır."],["e","Görsel okuma materyallerine ilişkin görüşlerini ifade eder."],["f","Özgün görsel okuma materyalleri oluşturur."]]],["TAOB.3","TA","Resimli öykü kitabı, dijital içerikler, afiş, broşür gibi görsel okuma materyallerini çözümleyebilme",[["a","Görsel okuma materyallerinde yer alan olayların parçalarını belirler."],["b","Görsel okuma materyallerinde yer alan olayların parçaları arasındaki ilişkiyi belirler."]]],["TAOB.4","TA","Resimli öykü kitabı, dijital içerikler, afiş, broşür gibi görsel okuma materyallerini değerlendirebilme",[["a","Görsel okuma sürecine ilişkin duygu ve düşüncelerini söyler."],["b","Görsel okuma ortamına ilişkin duygu ve düşüncelerini söyler."]]],["TAKB.1","TA","Konuşma sürecini yönetebilme",[["a","Konuşacağı konuyu seçer."],["b","Konuşma sırasında dinleyiciler ile göz teması kurar."],["c","İletişim sırasında uygun zamanda söz alır."]]],["TAKB.2","TA","Konuşma sürecinin içeriğini oluşturabilme",[["a","Konuşacağı konu ile ön bilgileri arasında bağlantı kurar."],["b","Konuşmanın devamı hakkındaki tahminini söyler."],["c","Konuşma sürecinde karşılaştırmalar yapar."],["ç","Konuşma sürecinde sınıflandırmalar yapar."],["d","Bir konuyu kendi cümleleriyle yeniden ifade eder."],["e","Şiir, hikâye, tekerleme gibi özgün sözlü ürün oluşturur."],["f","Konuşma sürecinde nefesini / sesini uygun şekilde kullanır."],["g","Topluluk önünde sözlü sunum yapar."]]],["TAKB.3","TA","Konuşma sürecinde Türkçeyi doğru kullanabilme",[["a","Konuşacağı konuyu planlar."],["b","Konuşurken benzetme ve örneklendirme içeren ifadeler kullanır."],["c","Öğrendiği yeni sözcükleri anlamına uygun kullanır."],["ç","Söylemek istediklerini açık biçimde ifade eder."],["d","Türkçe dil bilgisi kurallarına uygun konuşur."],["e","Konuşmasında beden dilini kullanır."]]],["TAKB.4","TA","Konuşma sürecini değerlendirebilme",[["a","Konuşma sürecine ilişkin duygu ve düşüncelerini söyler."],["b","Konuşma ortamına ilişkin duygu ve düşüncelerini söyler."],["c","Başkalarının görüşleri hakkında kendi fikirlerini söyler."]]],["TAEOB.1","TA","Yazı farkındalığına ilişkin becerileri gösterebilme",[["a","Görsel semboller arasından yazıyı gösterir."],["b","Günlük yaşamda sık karşılaştığı yazı ve sembolleri tanıyarak ne anlama geldiğini açıklar."],["c","Yazı yönünü gösterir."],["ç","İletişimde yazıya neden ihtiyaç duyulduğunu açıklar."],["d","Temel noktalama işaretlerinden nokta, soru işareti, ünlem ve virgülü gösterir."]]],["TAEOB.2","TA","Ses bilgisel farkındalık becerileri gösterebilme",[["a","Cümlede sözcükler arasında boşluk olduğunu ifade eder."],["b","Cümleyi sözcüklerine ayırır."],["c","Sözcükleri hecelerine ayırarak sayar."],["ç","Uyaklı sözcükleri eşleştirir."],["d","Söylenen sözcükle uyaklı sözcükler üretir."],["e","Sözcüklerin ilk / son seslerini söyler."],["f","Sözcüklerin ilk / son seslerinden yeni sözcükler üretir."]]],["TAEOB.3","TA","Sözcük-harf ilişkisini açıklayabilme",[["a","Sözcüklerin harflerden oluştuğunu söyler."],["b","Sözcüklerdeki büyük ve küçük harfleri gösterir."]]],["TAEOB.4","TA","Okuma öncesi becerileri kazanabilme",[["a","Uygun okuma şeklini gösterir."],["b","Kitabın temel unsurlarını açıklar."]]],["TAEOB.5","TA","Yazma öncesi becerileri kazanabilme",[["a","Yazma için uygun oturma pozisyonu alır."],["b","Kalemi doğru tutmak için üç parmağını işlevsel olarak kullanır."]]],["MAB.1","MA","Sayıları farklı durumlarda doğru kullanabilme",[["a","1 ile 20 arasında ileriye doğru birer ritmik sayar."],["b","10’dan 1’e geriye doğru ritmik sayar."],["c","1 ile 5 arasında nesne / varlık miktarını saymadan / bir bakışta söyler."],["ç","1 ile 20 arasındaki nesne / varlık miktarını sayarak belirler."],["d","10’a kadar verilen bir sayıdan önce / sonra verilen sayıyı söyler."],["e","Sayıları küçükten büyüğe / büyükten küçüğe sıralar."],["f","Nesne ya da kişilerin sırasını sıra bildiren sayı sözcükleriyle belirtir."]]],["MAB.2","MA","Parça-bütün özelliklerini çözümleyebilme",[["a","Bir bütünü oluşturan parçaları gösterir."],["b","Parçalar arasındaki benzerlik, eşlik ya da bütüne uygunluk ilişkisini söyler."],["c","İlişkili parçaları birleştirerek bütünü oluşturur."],["ç","Bir bütündeki eksik parçayı bulur."]]],["MAB.3","MA","Matematikle ilgili durumları yorumlayabilme",[["a","Matematikle ilgili bir durumu nesne / çizim / sembolle gösterir."],["b","Sayıları nesne / çizim / rakam kullanarak gösterir."],["c","Farklı büyüklükte / yönlerde sunulan geometrik şekilleri doğru isimlendirir."],["ç","Küp / küre gibi üç boyutlu cisimlere benzeyen nesneleri gösterir."],["d","Bir nesnenin konumunu ok / şema / çizim kullanarak gösterir."]]],["MAB.4","MA","Karşılaştırmaya ve tahmine dayalı çıkarım yapabilme",[["a","Uzunluk / büyüklük / ağırlık / miktar gibi birden fazla özelliğe ilişkin tahmini ile sonucu karşılaştırır."],["b","Örüntüyü kuralına uygun olarak devam ettirir."],["c","Bir örüntüde kurala uygun olmayan durumu açıklar."],["ç","Özgün örüntü oluşturur."],["d","Nesne / olgu / olayları birden fazla özelliğe göre karşılaştırır."],["e","Gerçekleşmesi mümkün olan / olmayan durumları söyler."]]],["MAB.5","MA","Matematikle ilgili problemleri çözümleyebilme",[["a","Verilen problemdeki eksik / fazla / uyumsuz durumları söyler."],["b","1-10 arası nesne / varlıkların artması / azalmasıyla oluşan yeni sonucu söyler."],["c","10’a kadar olan nesneleri eşit olarak paylaştırır."]]],["MAB.6","MA","Matematikle ilgili problemleri yorumlayabilme",[["a","Problem durumunu nesnelerle / çizimle / sözel olarak ifade eder."],["b","Problemin çözümden önceki ve sonraki durumlarını benzerlik / farklılıklarına göre karşılaştırır."]]],["MAB.7","MA","Matematikle ilgili problemlere çözüm yolları geliştirebilme",[["a","Bir problemin çözümüne ilişkin yollar önerir."],["b","Seçtiği çözüm yolunu dener."],["c","Çözüme ulaşamazsa başka bir yol dener."],["ç","Denediği yolla ulaştığı sonucu gerekçeleriyle açıklar."]]],["MAB.8","MA","Problem çözme deneyimlerini yansıtabilme",[["a","Problem çözme sürecindeki deneyimlerini anlatır."],["b","Deneyimlerini benzer problemlerin çözümünde kullanır."],["c","Kendi çözümünü arkadaşlarının çözümleri ile karşılaştırır."]]],["MAB.9","MA","Matematikle ilgili temsillerden yararlanabilme",[["a","Temel geometrik şekilleri isimlendirir."],["b","Günün zamanına ilişkin özellikleri söyler."],["c","Çeşitli semboller arasından matematikle ilgili temsili / sembolü gösterir."],["ç","1-10 arasındaki miktarları nesne / çizim / rakam gibi farklı temsillerle gösterir."],["d","Temel geometrik şekilleri farklı materyallerle oluşturur."],["e","Tanıdık çevreye ilişkin basit krokiyi kullanır."],["f","Tek özelliğe dayalı verileri grafik kullanarak sembolleştirir."]]],["MAB.10","MA","Matematikle ilgili temsilleri değerlendirebilme",[["a","Geometrik şekilleri kenar / köşe, sayı ve özelliklerine göre isimlendirir."],["b","Matematikle ilgili temsillerin / sembollerin benzerlik / farklılıklarını söyler."]]],["MAB.11","MA","Veriyle çalışabilme",[["a","Veri toplamak için plan yapar."],["b","Veri toplar."],["c","Elde edilen verinin kaynağını söyler."],["ç","Verileri benzer özelliklerine göre sınıflandırır."]]],["MAB.12","MA","Bulguya ulaşabilme",[["a","Sınıflandırılmış verileri göstermek için grafik / tablo / çizim gibi uygun bir yol seçer."],["b","Ulaştığı sonuçları çeşitli yollarla ifade eder."]]],["MAB.13","MA","Bulguyu yorumlayabilme",[["a","Elde ettiği sonuçlara ilişkin basit çıkarımlarda bulunur."],["b","Elde ettiği sonuçlara ilişkin soruları yanıtlar."]]],["FAB.1","FA","Günlük yaşamında fenle ilgili olaylara / olgulara ve durumlara yönelik bilimsel gözlem yapabilme",[["a","Çevresinde merak ettiği nesne / olay / olguları odaklanarak gözlemler."],["b","Gözlemlediği nesne / olay / olguların betimsel / fiziksel özelliklerini ayrıntılı olarak tanımlar."],["c","Duyuları aracılığıyla nesne / olay / olguların gözlemlenebilir özelliklerini açıklar."],["ç","Nesne / olay / olguların gözlemlenebilir özelliklerine ilişkin verileri toplar."],["d","Gözlemlediği nesne / olay / olguları uygun kayıt araçları kullanarak çizim, işaretleme, sembol kullanma yoluyla kaydeder."],["e","Gözlemlediği nesne / olay / olguların özelliklerini karşılaştırarak açıklar."],["f","Çevresindeki canlılara ait ses ve hareketlere ilişkin gözlemlerini betimleyerek ifade eder."]]],["FAB.2","FA","Fene yönelik nesne / olay / olguları benzerlik ve farklılıklarına göre sınıflandırabilme",[["a","Nesne / olay / olguların gözlemlenebilir özelliklerini karşılaştırarak söyler."],["b","Nesnelerde meydana gelen gözlemlenebilir değişiklikleri niteliklerine göre ayırt eder."],["c","Nesne / olay / olguları benzer özelliklerine göre sınıflandırır."],["ç","Benzer özellik gösteren nesne / olay / olguları uygun ifadelerle adlandırır."]]],["FAB.3","FA","Günlük yaşamda fen olaylarına yönelik bilimsel gözleme dayalı tahminlerde bulunabilme",[["a","Gözlemlediği çevresel durumlara göre günlük yaşamında nasıl davranması gerektiğine ilişkin tahminlerde bulunur."],["b","Yakın çevresinde meydana gelen değişimlere ilişkin gözlem ve deneyimlerinden hareketle tahminlerde bulunur."],["c","Nesnelerin belirli durumlardaki olası değişimlerine ilişkin tahminlerini uygun ifadelerle açıklar."],["ç","İnsan davranışlarının çevre üzerindeki olası etkilerine ilişkin tahminlerini ifade eder."]]],["FAB.4","FA","Fene yönelik olay ve / veya olgular hakkında bilimsel veriye dayalı tahminlerde bulunabilme",[["a","Elde ettiği verilerden ve ön bilgilerinden hareketle tahminde bulunur."],["b","Nesne / olay / olguların olası sonuçlarına ilişkin tahminlerini açıklar."],["c","Karşılaşılan çevresel sorunların ileride oluşturabileceği sonuçlara ilişkin tahminde bulunur."],["ç","Varlıkların gelişimi ve değişimine ilişkin tahminlerini standart olmayan ölçme yollarıyla kontrol eder."]]],["FAB.7","FA","Merak ettiği konular / olay / durum hakkında deneyler yapabilme",[["a","Merak ettiği konuya ilişkin deney yapmak için uygun malzemeleri seçer."],["b","Merak ettiği konuda deneme-yanılma yoluyla deney yapar."],["c","Deney sonucunda gözlemlediği durumu ifade eder."]]],["FAB.8","FA","Günlük hayatındaki fene yönelik olaylar hakkında gözlemlerine dayalı basit düzeyde bilimsel çıkarımlar yapabilme",[["a","Canlı / cansız varlıkların niteliklerine ilişkin gözlemlerinden sonuçlar çıkarır."],["b","Nesnelerde ve olaylarda gözlemlediği değişimlere ilişkin neden-sonuç ilişkileri kurar."],["c","Nesne / olay / olgulara ilişkin gözlem ve verilerine dayalı açıklamalar yapar."]]],["FAB.9","FA","Fene yönelik olay ve / veya olguları açıklamak için basit düzeyde bilimsel modellerden faydalanabilme",[["a","Yakın çevresindeki problemlerin çözümüne ilişkin hayal gücüne dayalı modeller önerir."],["b","Yakın çevresindeki bir problemi çözmek için oluşturduğu modeli yeniden düzenler."]]],["FAB.12","FA","Bilimsel olayları / olguları açıklamak için kanıtlar kullanabilme",[["a","Karşılaştığı problemlerin çözümüne yönelik elde ettiği verileri çizim, işaret, sembol ve görsellerle kaydeder."],["b","Karşılaştığı problem durumlarına ilişkin verileri benzer özelliklerine göre gruplandırır."],["c","Gözlem ve verilere dayalı açıklamalar yapar."]]],["FAB.13","FA","Fene yönelik günlük hayatla ilişkili olay, olgu ve / veya durumlara yönelik bilimsel sorgulama yapabilme",[["a","Günlük yaşamda karşılaştığı nesne / olay / olgulara ilişkin sorular sorar."],["b","Problem durumuna yönelik geliştirdiği modeli gerçek yaşamla karşılaştırır."],["c","Merak ettiği durumlara yönelik incelemeler yapar."],["ç","Problem çözümünde ulaştığı bilgi ve bulguları değerlendirir."],["d","Ulaştığı sonuçlara dayalı açıklamalar yapar."],["e","Görüşlerini akranlarıyla paylaşır."]]],["SAB.1","SA","Günlük hayatta karşılaştığı kavram / nesne / yer / toplum / olay / kişilere ilişkin zaman içerisinde değişen ve benzerlik gösteren özellikleri karşılaştırabilme",[["a","Gece-gündüz, sabah-akşam, dün-bugün gerçekleştirilen günlük yaşam etkinliklerini karşılaştırır."],["b","Yakın çevresindeki kişi, nesne ve mekânlardaki değişen ve değişmeyen özellikleri söyler."],["c","Ülkemizde ve yakın çevresinde kutlanan millî bayramlarda sorumluluk alır."],["ç","Dinî bayramlarda neler yapıldığını ifade eder."],["d","10 Kasım Atatürk’ü Anma Günü ile Atatürk Haftası gibi günlerin anlamını ve önemini açıklar."]]],["SAB.2","SA","Yakın çevresindeki olay / dönem / kavramları kronolojik olarak sıralayabilme",[["a","Gün akışındaki eylemlerini oluş sırasına uygun olarak sıralar."],["b","Bir olay kurgusunu oluş sırasına göre sıralar."]]],["SAB.3","SA","Olay / dönem ve kavramların zamanla geçirdikleri değişim / dönüşümleri karşılaştırarak ifade edebilme",[["a","Çeşitli nesnelerin geçmişteki hâllerini inceler."],["b","Çeşitli nesnelerin geçmişteki ve şimdiki hâllerini karşılaştırarak benzerlik ve farklılıklarını söyler."]]],["SAB.4","SA","Yakın çevresindeki yaşantılardan yola çıkarak ülkemizle ilgili merak ettiği konulara yönelik sorular sorabilme",[["a","Yakın çevresindeki / Ülkemizdeki nesne, kişi, yer ve olaylar hakkında merak ettiği konuya yönelik sorular sorar."],["b","Mustafa Kemal Atatürk’ün yaşamına ait sorular sorar."],["c","Türk bayrağı ve İstiklal Marşı ile ilgili sorular sorar."]]],["SAB.5","SA","Yakın çevresiyle / ülkemizle ilgili merak ettiği konuya yönelik kaynakları inceleyebilme",[["a","Yakın çevresinde merak ettiği konularla ilgili görsel / işitsel materyalleri inceler."],["b","Mustafa Kemal Atatürk’ün hayatıyla ilgili bilgileri inceler."],["c","Türk bayrağı ve İstiklal Marşı’yla ilgili kaynakları inceler."]]],["SAB.6","SA","Yakın çevresinde yer alan mekânın coğrafi koşullarını tanımlayabilme",[["a","Yakın çevresinin çeşitli coğrafi özelliklerini ifade eder."],["b","Yakın çevresinin coğrafi özelliklerine ilişkin görselleri inceler."]]],["SAB.7","SA","Merak ettiği coğrafi olay / olgu ve mekân / durumlara yönelik sorular sorabilme",[["a","Görseli / sembolü gösterilen hava olaylarının isimlerini söyler."],["b","Görseli göste /* ---------- Program sorguları ---------- */
const _outCache = {};
function outMap(age){
  if(_outCache[age]) return _outCache[age];
  const m={}; (PROG.ages[age]||[]).forEach(o=>{m[o[0]]={k:o[0],alan:o[1],ad:o[2],alt:o[3]}}); return _outCache[age]=m;
}
function outList(age,alan){ return (PROG.ages[age]||[]).filter(o=>!alan||o[1]===alan).map(o=>outMap(age)[o[0]]); }
const SUBRE = /^(.+\.\d+)\.([a-zçğıöşü])$/;
function subInfo(age,code){
  const m=code.match(SUBRE); if(!m) return null; const o=outMap(age)[m[1]]; if(!o) return null;
  const s=o.alt.find(x=>x[0]===m[2]); return s?{o,l:s[0],t:s[1]}:null;
}
function codeKind(c){
  if(/^E\d\.\d+$/.test(c)) return 'eg'; if(/^SDB\d\.\d$/.test(c)) return 'sdb';
  if(/^D\d+\.\d+$/.test(c)) return 'dg'; if(/^OB\d$/.test(c)) return 'ob';
  if(SUBRE.test(c)) return 's'; return null;
}
const ALLE = EGILIM.flatMap(g=>g[2].map(x=>x[0])), ALLD = DEGER.flatMap(g=>g[2].map(x=>x[0]));
function validCode(age,c){
  const k=codeKind(c); if(!k) return false;
  if(k==='s') return !!subInfo(age,c); if(k==='eg') return ALLE.includes(c);
  if(k==='dg') return ALLD.includes(c); if(k==='sdb') return SDB.some(x=>x[0]===c); return OB.some(x=>x[0]===c);
}
const CODE_SCAN = /(?:SDB\d\.\d|E\d\.\d+|D\d{1,2}\.\d|OB\d|[A-ZÇ]{2,5}\.\d{1,2}\.[a-zçğıöşü])(?![\wçğıöşü.])/g;
function scanCodes(age,text){ return uniq((String(text||'').match(CODE_SCAN)||[]).filter(c=>validCode(age,c))); }
const sortCodes = arr => arr.slice().sort((a,b)=>a.localeCompare(b,'tr',{numeric:true}));
function ordS(age,codes){ // program sırasına göre
  const order=(PROG.ages[age]||[]).map(o=>o[0]);
  return codes.slice().sort((a,b)=>{const ma=a.match(SUBRE),mb=b.match(SUBRE);const ia=order.indexOf(ma[1]),ib=order.indexOf(mb[1]);if(ia!==ib)return ia-ib;
    const o=outMap(age)[ma[1]];return o.alt.findIndex(x=>x[0]===ma[2])-o.alt.findIndex(x=>x[0]===mb[2])});
}

/* ---------- Plan yardımcıları ---------- */
function monthOf(key){return S.year.find(m=>m.key===key)}
function schoolWeeks(key){
  const [y,m]=key.split('-').map(Number); const first=new Date(y,m-1,1); const last=new Date(y,m,0);
  const d=new Date(first); d.setDate(d.getDate()-((d.getDay()+6)%7)); const weeks=[];
  while(d<=last){weeks.push(dkey(d)); d.setDate(d.getDate()+7);}
  return weeks.filter(w=>{const mon=pdate(w);for(let i=0;i<5;i++){const x=new Date(mon);x.setDate(x.getDate()+i);if(x.getMonth()===m-1)return true}return false});
}
function weekInfo(dateK){
  const d=pdate(dateK); const mo=monthOf(mkey(d));
  if(!mo) return {mo:null,i:0,w:{baslik:'Serbest tema',tema:'okul'}};
  const mon=new Date(d); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  let i=schoolWeeks(mo.key).indexOf(dkey(mon)); if(i<0)i=0;
  return {mo,i,w:mo.weeks[Math.min(i,mo.weeks.length-1)]};
}
const ROT=[['TA','HSA','SNA'],['MA','MSA','SA'],['FA','TA','HSA'],['SNA','MA','MSA'],['SA','FA','HSA']];
function flowDefaults(th){
  const ndx=shuffle(th.n).slice(0,4);
  return {
    baslama:`Sınıfa gelen çocuklar günün zaman dilimine uygun bir selamlama ile karşılanır. Yoklama panosunda çocuklar kendi fotoğraflarının yanına işaret koyarak yoklamaya katılır; sınıfta bulunan ve bulunmayan çocuklar birlikte belirlenir. Günün sorumlusu takvim ve hava durumu panosunu düzenler; "Bugün günlerden ne?", "Bugün ayın kaçı?" ve "Bugün hava nasıl?" gibi rutin sorular üzerine sohbet edilir. Ardından "${th.soru}" sorusuyla güne başlanır ve çocukların duygu durumları hakkında sohbet edilir (SDB1.2, D12.1).`,
    merkez:`Çocuklara öğrenme merkezleri tanıtılır ve merkezlere ${th.ad} temalı materyaller (${ndx.map(x=>x[0]).join(', ')}) eklenir. Merkez seçim panosunda çocuklar gitmek istedikleri merkezin altındaki boşluklardan birine kendi fotoğraflarını yerleştirir; bir merkezin kontenjanı dolduğunda diğer merkezleri tercih eder. Merkez değişim zamanı zil sesiyle haber verilir. Süreç boyunca öğretmen çocukların oyunlarını gözlemler, gereksinim duyduklarında sözel rehberlik sağlar ve akran etkileşimlerini destekler.`,
    beslenme:'Çocuklar öğrenme merkezlerindeki oyunlarını tamamladıktan sonra bir toplanma şarkısı eşliğinde kullandıkları oyuncak ve materyalleri ait oldukları yerlere yerleştirir. Ardından el yıkama, beslenme ve temizlik süreçlerine geçilir. Çocuklar beslenme öncesinde ve sonrasında temizlik kurallarına uygun davranır, oluşan atıkları uygun çöp kutusuna atar ve sınıfın temiz ve düzenli kalmasına katkı sağlar (D16.1).'
  };
}
function newDay(dateK, withActs=true){
  const wi=weekInfo(dateK); const th=TEMA[wi.w.tema]||TEMA.okul; const d=pdate(dateK);
  const rot=ROT[Math.max(0,Math.min(4,(d.getDay()+6)%7))];
  const acts = withActs ? rot.slice(0,2).map(a=>generate({alan:a,tema:wi.w.tema})) : [];
  return { tema:wi.w.tema, haftaBaslik:wi.w.baslik, acts, flow:flowFor(th,AGE()), extra:[],
    ortamlar:`Etkinlik öncesinde gerekli materyaller hazırlanır ve ${th.ad} temalı görseller panoya yerleştirilir. Çocukların güvenli biçimde hareket edebilecekleri geniş bir alan oluşturulur.`,
    degEk:'', toplum:`${th.ad} ile ilgili bir meslek grubundan ya da yakın çevreden bir konuk sınıfa davet edilebilir; park, müze, kütüphane gibi uygun bir öğrenme ortamına gezi planlanabilir.`,
    aileEk:'', notlar:'' };
}
function newMonth(key){
  const mo=monthOf(key); const age=AGE();
  const sel={s:[],eg:[],sdb:[],dg:[],ob:[],kv:[]};
  if(mo){
    const samp=[]; mo.weeks.forEach(w=>ALAN_KEYS.forEach(a=>samp.push(generate({alan:a,tema:w.tema,yas:age}))));
    const sp=splitCodes(age,samp.flatMap(actCodes));
    const top=(arr,n)=>{const cnt={};arr.forEach(x=>cnt[x]=(cnt[x]||0)+1);return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0])};
    const all=samp.flatMap(actCodes);
    sel.s=ordS(age,top(all.filter(c=>codeKind(c)==='s'),26));
    sel.eg=sortCodes(top(all.filter(c=>codeKind(c)==='eg'),8));
    sel.sdb=sortCodes(top(all.filter(c=>codeKind(c)==='sdb'),5));
    const dgFromYear=mo.deger.flatMap(g=>{const x=DEGER.find(d=>d[0]===g);return x?[x[2][0][0]]:[]});
    sel.dg=sortCodes(uniq([...dgFromYear,...top(all.filter(c=>codeKind(c)==='dg'),4)]));
    sel.ob=sortCodes(top(all.filter(c=>codeKind(c)==='ob'),4));
    sel.kv=uniq(mo.weeks.flatMap(w=>(TEMA[w.tema]||TEMA.okul).k));
  }
  const eyl=key.endsWith('-09');
  return {sel, uyg:AY_METIN.uyg, zen:AY_METIN.zen, des:AY_METIN.des, aile:eyl?EYLUL_AILE:AY_METIN.aile, kanit:eyl?EYLUL_KANIT:AY_METIN.kanit,
    cocuk:AY_METIN.cocuk, program:AY_METIN.program, ogretmen:AY_METIN.ogretmen, yansitma:''};
}
function getDay(k){ if(!S.daily[k]){S.daily[k]=newDay(k,false);} return S.daily[k]; }
function getMonth(k){ if(!S.monthly[k]){S.monthly[k]=newMonth(k);save();} return S.monthly[k]; }
function dayCodes(p){
  const age=AGE();
  return splitCodes(age,[...p.acts.flatMap(actCodes),...scanCodes(age,Object.values(p.flow).join(' ')),...(p.extra||[])]);
}

function vControl(){
  const age=AGE(); const months=S.year.map(m=>({m,M:S.monthly[m.key]}));
  const head=`<tr><th class="sticky">Bileşen</th>${months.map(({m})=>`<th>${AYLAR[+m.key.slice(5)-1].slice(0,3)}</th>`).join('')}</tr>`;

  let rows='';
  ALAN_KEYS.forEach(a=>{rows+=`<tr class="sec-row"><td colspan="${months.length+1}" style="--ac:${ALAN[a].c}">${ALAN[a].up}</td></tr>`;
    outList(age,a).forEach(o=>{rows+=`<tr><td class="sticky"><b>${o.k}.</b> ${esc(o.ad)}</td>${mark(s=>s.s.some(c=>c.startsWith(o.k+'.')))}</tr>`;});});

  rows+=`<tr class="sec-row"><td colspan="${months.length+1}">SOSYAL-DUYGUSAL ÖĞRENME BECERİLERİ</td></tr>`;
  SDB.forEach(x=>{rows+=`<tr><td class="sticky"><b>${x[0]}.</b> ${x[1]}</td>${mark(s=>s.sdb.includes(x[0]))}</tr>`});
  rows+=`<tr class="sec-row"><td colspan="${months.length+1}">DEĞERLER</td></tr>`;
  DEGER.forEach(g=>g[2].forEach(x=>{rows+=`<tr><td class="sticky"><b>${x[0]}.</b> ${x[1]}</td>${mark(s=>s.dg.includes(x[0]))}</tr>`}));
  rows+=`<tr class="sec-row"><td colspan="${months.length+1}">OKURYAZARLIK BECERİLERİ</td></tr>`;
  OB.forEach(x=>{rows+=`<tr><td class="sticky"><b>${x[0]}.</b> ${x[1]}</td>${mark(s=>s.ob.includes(x[0]))}</tr>`});
  rows+=`<tr class="sec-row"><td colspan="${months.length+1}">KAVRAMLAR</td></tr>`;
  KAVRAM.forEach(k=>{rows+=`<tr><td class="sticky">${esc(k[0])}</td>${months.map(({M})=>{const v=M?M.sel.kv.filter(p=>p.startsWith(k[0]+'|')).map(p=>p.split('|')[1]):[];return `<td class="small">${esc(v.join(', '))}</td>`}).join('')}</tr>`});
  const missing=months.filter(x=>!x.M).length;
  return `<section class="panel" style="display:grid;gap:12px">
    <p class="small muted">EK-15 Aylık Eğitim Planı Kontrol Çizelgesi (${esc(age)}): yıl boyunca hangi bileşenlerin hangi ayda ele alındığını gösterir. ${missing?`${missing} ay için henüz aylık plan açılmadı.`:''}</p>
    ${missing?'<div class="toolbar"><button class="btn sm" data-do="allmonths">Tüm ayların planını oluştur</button></div>':''}
    <div class="tbl-wrap"><table class="ctrl">${head}${rows}</table></div></section>`;
}

function vMonth(){
  const key=S.ui.month; const mo=monthOf(key); const age=AGE();

  const M=getMonth(key); const th=TEMA[mo.weeks[0].tema]||TEMA.okul; const [y,mm]=key.split('-').map(Number);
  const weeks=schoolWeeks(key); const sel=M.sel;

  const cells=[]; const today=dkey(new Date());
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i); if(i>=35&&d.getMonth()!==mm-1)break;

    const day=d.getDate(); const ozel=out?null:mo.gunler.find(g=>{const m2=g.match(/\((\d{1,2})(?:-\d{1,2})? (Ocak|Şubat|Mart|Nisan|Mayıs|Haziran|Temmuz|Ağustos|Eylül|Ekim|Kasım|Aralık)/);return m2&&+m2[1]===day&&AYLAR.indexOf(m2[2])===mm-1});
    cells.push(`<button class="day ${out?'out':''} ${we?'we':''} ${k===today?'today':''}" data-do="openday" data-key="${k}" aria-label="${fmtLong(k)}"><span class="dn">${day}</span><span class="de">${p&&p.acts.length?p.acts.map(a=>em(a.gorsel[1])).join(''):''}</span>${ozel?`<span class="dt">${esc(ozel.replace(/\s*\(.*$/,''))}</span>`:''}</button>`);}

  return `
  <div class="page-head"><div><span class="label">Aylık eğitim planı · ${esc(age)}</span><h1>${AYLAR[mm-1]} ${y}</h1></div>
   <div class="toolbar"><label class="field" style="min-width:min(100%,280px)"><span>Ay</span><select id="msel">${opts}</select></label>${inFrame?'':`<button class="btn" data-do="print">${IC.print} Yazdır</button>`}<button class="btn" data-do="word" data-kind="month">📄 Word’e aktar</button><button class="btn" data-do="fillmonth">Tüm iş günlerini planla</button><button class="btn ghost" data-do="remonth">Seçimleri yeniden öner</button></div></div>
  ${banner(th,`${AYLAR[mm-1]} ayı teması`,mo.baslik,mo.ozet,'h2')}
  <section class="weeks">${mo.weeks.map((w,i)=>{const t2=TEMA[w.tema]||TEMA.okul;const wk=weeks[i];return `<article class="week"><div class="week-top" style="background:${t2.c}"><div><span class="label" style="color:#fff;opacity:.85">${i+1}. hafta${wk?' · '+pdate(wk).getDate()+' '+AYLAR[pdate(wk).getMonth()].slice(0,3):''}</span><h4 style="color:#fff">${esc(w.baslik)}</h4></div><span class="em">${t2.em.slice(0,2).map(em).join('')}</span></div>
    <div class="week-body"><span class="small muted">Tema: ${esc(t2.ad)}</span><div class="chips">${t2.k.slice(0,3).map(k=>`<span class="chip">${esc(k.split('|')[1])}</span>`).join('')}</div>
    <div class="toolbar"><button class="btn sm" data-do="genfor" data-tema="${w.tema}">✨ Etkinlik üret</button>${wk?`<button class="btn sm" data-do="openday" data-key="${wk}">Haftayı aç</button>`:''}</div></div></article>`}).join('')}</section>
  <section class="panel no-print" style="display:grid;gap:12px"><div class="page-head"><h2>Takvim</h2><span class="small muted">Bir güne dokunarak günlük planını açın.</span></div>
    <div class="cal">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div></section>
  <section class="sheet">
    <div class="sheet-title"><b>AYLIK EĞİTİM PLANI</b><span>${AYLAR[mm-1]} ${y} · ${esc(age)} · ${esc(S.settings.okul||'')}</span></div>
    <div class="sec"><div class="sec-title"><span class="num">1</span><h3>Alan Becerileri, Öğrenme Çıktıları ve Süreç Bileşenleri</h3><button class="btn sm no-print" data-do="pick" data-target="month">Seç / düzenle</button></div>${hierS(age,ordS(age,sel.s))}</div>
    <div class="sec"><div class="sec-title"><span class="num">2</span><h3>Eğilimler</h3></div>${hierE(sel.eg)}<details class="no-print"><summary class="small">Eğilim seç</summary>${togs('eg',EGILIM.flatMap(g=>g[2]))}</details></div>
    <div class="sec"><div class="sec-title"><span class="num">3</span><h3>Programlar Arası Bileşenler</h3></div>
      <dl class="kv"><dt>Sosyal-Duygusal Öğrenme Becerileri</dt><dd>${listSDB(sel.sdb)}<details class="no-print"><summary class="small">Beceri seç</summary>${togs('sdb',SDB)}</details></dd>
      <dt>Değerler</dt><dd>${hierD(sel.dg)}<details class="no-print"><summary class="small">Değer seç</summary>${DEGER.map(g=>`<div class="mini-row" style="margin-top:6px"><b class="small">${g[0]}. ${g[1]}</b>${togs('dg',g[2])}</div>`).join('')}</details></dd>

      <details class="no-print"><summary class="small">Kavram seç (EK-7)</summary>${KAVRAM.map(k=>`<div style="margin-top:8px"><b class="small">${esc(k[0])}</b><div class="chips">${k[1].map(v=>{const pv=k[0]+'|'+v;return `<button class="chip" data-do="tog" data-f="kv" data-v="${esc(pv)}" aria-pressed="${sel.kv.includes(pv)}">${esc(v)}</button>`}).join('')}</div></div>`).join('')}</details></div>

    <div class="sec"><div class="sec-title"><span class="num">10</span><h3>Öğretmen Yansıtmaları</h3></div>${ta('m-yan','yansitma','Ay sonunda planın uygulanmasına ilişkin düşünceleriniz…')}</div>
  </section>`;

    +daySorular(p).map(s=>wbul(s)).join('')+wp(DEG_KAPANIS())+(p.degEk?wText(p.degEk):'');

  if(p.notlar) b+=wh1('ÖĞRETMEN NOTU')+wText(p.notlar);

function docMonth(key){

  b+=wh1('KAVRAMLAR');
  {const by={};sel.kv.forEach(p=>{const [k,v]=p.split('|');(by[k]=by[k]||[]).push(v)}); b+=KAVRAM.filter(k=>by[k[0]]).map(k=>wLabel(k[0],uniq(by[k[0]]).join(', '))).join('')||wp('—');}
  b+=wh1('BELİRLİ GÜN VE HAFTALAR')+((mo&&mo.gunler.length)?mo.gunler.map(g=>wbul(g,200)).join(''):wp('—'));
  b+=wh1('ÖĞRENME-ÖĞRETME YAŞANTILARI')+wh2('Öğrenme-Öğretme Uygulamaları')+wText(M.uyg);
  b+=wh1('FARKLILAŞTIRMA')+wh2('Zenginleştirme')+wText(M.zen)+wh2('Destekleme')+wText(M.des);

  b+=wh1('ÖĞRETMEN YANSITMALARI')+wText(M.yansitma);

/* EK-2 Anekdot Kayıt Formu */
function anekSkills(r){
  const age=AGE(); const lines=[];
  (r.kodlar||[]).forEach(c=>{const k=codeKind(c); let t='';
    if(k==='s'){const si=subInfo(age,c); if(si) t=si.t;}
    else if(k==='sdb'){const x=SDB.find(v=>v[0]===c); t=x?x[1]:''}
    else if(k==='eg'){const x=EGILIM.flatMap(g=>g[2]).find(v=>v[0]===c); t=x?x[1]:''}
    else if(k==='dg'){const x=DEGER.flatMap(g=>g[2]).find(v=>v[0]===c); t=x?x[1]:''}
    if(t) lines.push([c,t]);});
  return lines;
}
function docAnek(r){
  const W=[2700,7164]; const fill='F2E2DC';
  const sk=anekSkills(r);
  const skXML=(sk.map(([c,t])=>wp(wr(c+'. ',{b:true})+wr(t),{after:20})).join('')+(r.beceri?wText(r.beceri):''))||wp('');
  let b=wp(wr('EK-2 ANEKDOT KAYIT FORMU',{color:'D9542B'}),{style:'Title'});
  b+=wp(wr('Günlük plan kapsamında gerçekleştirilen etkinliklerin ardından yapılan gözlemler doğrultusunda günlük veya haftalık olarak ya da özel bir durumun ortaya çıkması hâlinde anekdot kaydı tutulması beklenmektedir. Bu form, çocuğa ilişkin olumlu veya olumsuz nitelikte dikkat çekici bir durum gözlemlendiğinde öğretmen tarafından gerektiği zaman doldurulabilir.',{sz:19,color:'444444'}),{after:160});
  b+=wtable([
    [{c:wp(wr('Çocuğun Adı Soyadı'),{after:0}),col:0},{c:wp(wr(r.cocuk),{after:0}),col:1}],
    [{c:wp(wr('Tarih'),{after:0}),col:0},{c:wp(wr(r.tarih?fmtLong(r.tarih):''),{after:0}),col:1}],
    [{c:wp(wr('Gözlenen Mekân'),{after:0}),col:0},{c:wp(wr(r.mekan),{after:0}),col:1}],
    [{c:wp(wr('Gözlenen Durum')+wr('\n(Bu formu doldurmanıza neden olan durumu açıklamanız beklenmektedir.)',{sz:17,color:'555555'}),{after:0}),span:2,fill}],
    {minH:1800,cells:[{c:wText(r.durum),span:2}]},
    [{c:wp(wr('Gözlenen Beceriler'),{after:0}),span:2,fill}],
    {minH:1500,cells:[{c:skXML,span:2}]},
    [{c:wp(wr('Gözlemcinin Genel Değerlendirmesi'),{after:0}),span:2,fill}],
    {minH:1800,cells:[{c:wText(r.deg),span:2}]}
  ],W);
  b+=wp(wr(`Gözlemci: ${S.settings.ogretmen||''}`,{sz:19,color:'444444'}),{before:120});
  return b;
}
async function exportWord(kind,arg){
  try{
    let body,name,title;
    if(kind==='day'){body=docDay(arg);name=`gunluk-plan-${arg}.docx`;title=`Günlük Plan ${fmtLong(arg)}`;}
    else if(kind==='month'){body=docMonth(arg);name=`aylik-plan-${arg}.docx`;title=`Aylık Eğitim Planı ${arg}`;}
    else if(kind==='anek'){const r=S.anek.find(x=>x.id===arg);body=docAnek(r);name=`anekdot-${slug(r.cocuk)}-${r.tarih||''}.docx`;title='Anekdot Kayıt Formu';}
    else if(kind==='rapor'){const c=rapCur();body=docRapor(c.child,c.dn);name=`beceri-edinim-${slug(c.child)}-${c.dn}-donem.docx`;title='Beceri Edinim Raporu Hazırlık Formu';}
    else if(kind==='raporAll'){const c=rapCur();const ns=childNames();body=ns.map(n=>docRapor(n,c.dn)).join(wbr());name=`beceri-edinim-tum-cocuklar-${c.dn}-donem.docx`;title='Beceri Edinim Raporu Hazırlık Formları';}
    else if(kind==='anekAll'){const list=anekFiltered();body=list.map(docAnek).join(wbr());name=`anekdot-kayitlari-${slug(S.ui.anekF&&S.ui.anekF!=='ALL'?S.ui.anekF:'tum-cocuklar')}.docx`;title='Anekdot Kayıtları';}
    await saveFile(name,docxBlob(body,title));
  }catch(e){console.error(e);toast('Word dosyası oluşturulamadı');}
}

const CLASS_FIELDS = ['year','monthly','daily','anek','cocuklar','rapor'];
function newClassData(yas){ return {year:yearFor(S.settings.baslangic,yas),monthly:{},daily:{},anek:[],cocuklar:[],rapor:{}}; }
const curClass = () => S.siniflar.find(c=>c.id===S.aktif);
function stashActive(){ const d={}; CLASS_FIELDS.forEach(f=>d[f]=S[f]); S.sdata[S.aktif]=d; }
function switchClass(id){
  if(id===S.aktif) return;
  stashActive();
  const c=S.siniflar.find(x=>x.id===id); const d=S.sdata[id]||newClassData(c.yas);
  CLASS_FIELDS.forEach(f=>S[f]=d[f]); delete S.sdata[id];
  S.aktif=id; S.settings.yas=c.yas; S.settings.sinif=c.ad; S.ui.gen.yas=c.yas; S.ui.anekDraft=null; S.ui.anekF='ALL'; S.ui.rapC=null;
  save(); render(); toast(`${c.ad} (${c.yas}) açıldı`);
}
function migrateClasses(){
  S.rapor=S.rapor||{}; S.anek=S.anek||[]; S.cocuklar=S.cocuklar||[];
  if(S.siniflar) return;
  const yas=S.settings.yas||'60-72 ay';
  S.siniflar=[{id:'c'+uid(),ad:S.settings.sinif||`${yas} grubu`,yas}];
  S.aktif=S.siniflar[0].id; S.sdata={};
  AGES.filter(a=>a!==yas).forEach(a=>S.siniflar.push({id:'c'+uid(),ad:`Anasınıfı (${a})`,yas:a}));
  S.siniflar.sort((a,b)=>AGES.indexOf(a.yas)-AGES.indexOf(b.yas));
}

const DONEM = {1:{ad:'1. dönem',ay:[9,10,11,12,1]},2:{ad:'2. dönem',ay:[2,3,4,5,6]}};
const DURUM = [['g','Gözlendi','✓'],['d','Gelişiyor','~'],['s','Desteklenmeli','!']];
function donemMonths(dn){ return S.year.filter(m=>DONEM[dn].ay.includes(+m.key.slice(5))); }
function donemCodes(dn){ const age=AGE(); return ordS(age,uniq(donemMonths(dn).flatMap(m=>S.monthly[m.key]?S.monthly[m.key].sel.s:[])).filter(c=>subInfo(age,c))); }
function donemRange(dn){ const ms=donemMonths(dn).map(m=>m.key); return [ms[0]+'-01', ms[ms.length-1]+'-31']; }
function rapKey(c,dn){ return `${c}|${dn}`; }
function rapData(c,dn){ const k=rapKey(c,dn); if(!S.rapor[k]) S.rapor[k]={not:{},genel:''}; return S.rapor[k]; }
function anekFor(child,dn){ const [a,b]=donemRange(dn); return S.anek.filter(r=>r.cocuk===child&&r.tarih>=a&&r.tarih<=b); }
function vRapor(){
  const age=AGE(); const names=childNames(); const dn=S.ui.rapD||((new Date().getMonth()+1)>=2&&(new Date().getMonth()+1)<=8?2:1);
  const child=S.ui.rapC&&names.includes(S.ui.rapC)?S.ui.rapC:names[0]; const codes=donemCodes(dn);
  const missing=donemMonths(dn).filter(m=>!S.monthly[m.key]).length;
  let body='';
  if(!child) body=`<div class="empty"><div class="em">👧</div><b>Önce çocuk listesini ekleyin</b><span class="small">Aşağıdaki kutuya her satıra bir çocuk adı yazın ya da anekdot kaydı ekleyin.</span></div>`;
  else {
    const R=rapData(child,dn); const ank=anekFor(child,dn);
    const cnt={g:0,d:0,s:0}; codes.forEach(c=>{const v=R.not[c]; if(v) cnt[v]++;});
    const byAlan={}; codes.forEach(c=>{const si=subInfo(age,c); (byAlan[si.o.alan]=byAlan[si.o.alan]||[]).push(si)});
    body=`<section class="sheet">
      <div class="sheet-title"><b>BECERİ EDİNİM RAPORU HAZIRLIĞI</b><span>${esc(child)} · ${DONEM[dn].ad} · ${esc(age)}</span></div>
      <div class="sec"><div class="stat-row"><div class="stat"><span class="label">Ele alınan bileşen</span><b>${codes.length}</b></div><div class="stat"><span class="label">İşaretlenen</span><b>${cnt.g+cnt.d+cnt.s}</b></div><div class="stat"><span class="label">Anekdot kaydı</span><b>${ank.length}</b></div></div>
        <p class="note">Program, Beceri Edinim Raporu’nun dönem sonlarında e-Okul üzerinden, dönem boyunca ele alınan öğrenme çıktıları ve süreç bileşenlerine göre doldurulmasını ister. Bu sayfa o rapora hazırlıktır: listede yalnızca bu dönemin aylık planlarında seçtiğiniz bileşenler vardır. "Gözlendi / Gelişiyor / Desteklenmeli" işaretleri sizin notunuzdur; e-Okul’daki seçenekleri esas alın.</p>
        ${missing?`<div class="toolbar"><span class="small muted">${missing} ayın aylık planı henüz açılmadı.</span><button class="btn sm" data-do="allmonths">Tüm ayların planını oluştur</button></div>`:''}</div>
      <div class="sec">${codes.length?ALAN_KEYS.filter(a=>byAlan[a]).map(a=>`<div class="h-alan" style="--ac:${ALAN[a].c}">${ALAN[a].up}</div>${byAlan[a].map(si=>{const c=`${si.o.k}.${si.l}`;const ev=ank.filter(r=>(r.kodlar||[]).includes(c)).length;return `<div class="rap-row"><div class="rap-t"><b>${c}.</b> ${esc(si.t)}${ev?` <span class="chip code" title="Bu bileşene bağlı anekdot kaydı">📝 ${ev}</span>`:''}</div><div class="rap-b" role="group" aria-label="${c} durumu">${DURUM.map(([v,l,s])=>`<button class="chip st-${v}" data-do="rapset" data-c="${esc(c)}" data-v="${v}" aria-pressed="${R.not[c]===v}">${s} ${l}</button>`).join('')}</div></div>`}).join('')}`).join(''):'<p class="muted small">Bu dönemin aylık planlarında henüz süreç bileşeni seçilmemiş.</p>'}</div>
      <div class="sec"><div class="sec-title"><h3>Anekdot kayıtları (kanıtlar)</h3></div>${ank.length?ank.map(r=>`<p class="small"><b>${fmtShort(r.tarih)}</b> · ${esc(r.mekan||'')} — ${esc((r.durum||'').slice(0,180))}${(r.durum||'').length>180?'…':''}</p>`).join(''):'<p class="muted small">Bu dönemde bu çocuk için anekdot kaydı yok.</p>'}</div>
      <div class="sec"><div class="sec-title"><h3>Öğretmenin genel değerlendirme ve gözlemleri</h3></div><textarea id="r-genel" data-bind="rap.genel" placeholder="Çocuğun güçlü yönleri, gelişim gösterdiği ve desteklenmesi gereken alanlar…">${esc(R.genel)}</textarea></div>
    </section>`;
  }
  return `
  <div class="page-head"><div><span class="label">Sonuç odaklı değerlendirme</span><h1>Beceri Edinim Raporu</h1><p class="muted">Dönem boyunca tuttuğunuz anekdot kayıtları ve aylık planlarınızdaki bileşenlerle her çocuk için rapor hazırlığı.</p></div>
    <div class="toolbar">${child?`<button class="btn" data-do="word" data-kind="rapor">📄 Word’e aktar</button><button class="btn" data-do="word" data-kind="raporAll">📄 Tüm çocuklar</button>`:''}</div></div>
  <section class="panel" style="display:grid;gap:12px">
    <div class="alan-pick">${[1,2].map(d=>`<button data-do="rapD" data-v="${d}" aria-pressed="${dn===d}" style="--ac:var(--accent)">${DONEM[d].ad}</button>`).join('')}</div>
    ${names.length?`<div class="alan-pick">${names.map(n=>`<button data-do="rapC" data-v="${esc(n)}" aria-pressed="${n===child}" style="--ac:var(--c-sa)">${esc(n)}</button>`).join('')}</div>`:''}
    <details ${names.length?'':'open'}><summary class="small">Çocuk listesini düzenle (${(S.cocuklar||[]).length})</summary><textarea id="r-list" placeholder="Her satıra bir çocuk adı soyadı">${esc((S.cocuklar||[]).join('\n'))}</textarea><div class="toolbar"><button class="btn sm primary" data-do="rlist">Listeyi kaydet</button></div></details>
  </section>
  ${body}`;
}
function docRapor(child,dn){
  const age=AGE(); const R=rapData(child,dn); const codes=donemCodes(dn); const ank=anekFor(child,dn); const st=S.settings;
  const lab=v=>{const d=DURUM.find(x=>x[0]===v);return d?d[1]:''};
  let b=wp(wr('BECERİ EDİNİM RAPORU HAZIRLIK FORMU'),{style:'Title'});
  b+=wInfo([['Çocuğun Adı Soyadı',child],['Okul Adı',st.okul],['Sınıf / Yaş Grubu',`${curClass().ad} · ${age}`],['Dönem',`${DONEM[dn].ad} (${st.baslangic}-${st.baslangic+1})`],['Öğretmenin Adı',st.ogretmen]]);
  b+=wp(wr('Bu form, e-Okul’daki Beceri Edinim Raporu’na hazırlık amacıyla dönem boyunca ele alınan süreç bileşenleri, gözlem notları ve anekdot kayıtlarından hazırlanmıştır.',{i:true,sz:18,color:'555555'}));
  b+=wh1('ÖĞRENME ÇIKTILARI VE SÜREÇ BİLEŞENLERİ');
  const W=[1500,6064,2300];
  const byAlan={}; codes.forEach(c=>{const si=subInfo(age,c);(byAlan[si.o.alan]=byAlan[si.o.alan]||[]).push(si)});
  if(!codes.length) b+=wp('—');
  ALAN_KEYS.filter(a=>byAlan[a]).forEach(a=>{
    b+=wh2(ALAN[a].up);
    b+=wtable([[{c:wp(wr('Kod',{b:true}),{after:0}),fill:'EEF3FB',col:0},{c:wp(wr('Süreç bileşeni',{b:true}),{after:0}),fill:'EEF3FB',col:1},{c:wp(wr('Durum',{b:true}),{after:0}),fill:'EEF3FB',col:2}],
      ...byAlan[a].map(si=>{const c=`${si.o.k}.${si.l}`;return [{c:wp(wr(c,{b:true}),{after:0}),col:0},{c:wp(wr(si.t),{after:0}),col:1},{c:wp(wr(lab(R.not[c])),{after:0}),col:2}]})],W);
  });
  b+=wh1('ANEKDOT KAYITLARI');
  b+=ank.length?ank.map(r=>wp(wr(fmtShort(r.tarih)+(r.mekan?' · '+r.mekan:'')+': ',{b:true})+wr(r.durum||''))).join(''):wp('—');
  b+=wh1('ÖĞRETMENİN GENEL DEĞERLENDİRME VE GÖZLEMLERİ')+wText(R.genel);
  return b;
}

function rapCur(){ const names=childNames(); const dn=S.ui.rapD||((new Date().getMonth()+1)>=2&&(new Date().getMonth()+1)<=8?2:1); const child=S.ui.rapC&&names.includes(S.ui.rapC)?S.ui.rapC:names[0]; return {child,dn}; }
function vDeger(){
  const t=S.ui.dTab||'anek';
  return `<div class="alan-pick" role="tablist"><button data-do="dtab" data-v="anek" aria-pressed="${t==='anek'}" style="--ac:var(--accent)">📝 Anekdot kayıtları (EK-2)</button><button data-do="dtab" data-v="rapor" aria-pressed="${t==='rapor'}" style="--ac:var(--accent)">📊 Beceri Edinim Raporu</button></div>`+(t==='rapor'?vRapor():vAnek());
}

/* ---------- Modallar ---------- */
function modal(html){ $('#modal-root').innerHTML=`<div class="modal-bg" data-do="mclose"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $('#modal-root').innerHTML=''; }
function findAct(ctx,id){
  if(ctx==='gen') return S.gen.find(a=>a.id===id);
  if(ctx==='bank') return S.bank.find(a=>a.id===id);
  if(ctx==='plan') {for(const k in S.daily){const a=S.daily[k].acts.find(x=>x.id===id);if(a)return a}}
  return null;
}

      <dt>Zenginleştirme</dt><dd ${ce} data-ef="zengin">${esc(a.zengin)}</dd>
      <dt>Destekleme</dt><dd ${ce} data-ef="destek">${esc(a.destek)}</dd>
      <dt>Aile katılımı</dt><dd ${ce} data-ef="aile">${esc(a.aile)}</dd></dl>
    <div class="toolbar">${ed?`<button class="btn primary" data-do="msave" data-ctx="${ctx}" data-id="${a.id}">Kaydet</button>`:''}${ctx!=='plan'?`<button class="btn ${ed?'':'primary'}" data-do="addplan" data-ctx="${ctx}" data-id="${a.id}">${IC.plus} Plana ekle</button>`:''}${ctx==='gen'?`<button class="btn" data-do="save" data-ctx="gen" data-id="${a.id}">Bankaya kaydet</button>`:''}<button class="btn ghost" data-do="mclose">Kapat</button></div>
  </div>`);

  const age=AGE(); const tab=S.ui.pickA||'TA'; const set=pickTarget();
  const fromActs = S.ui.pickT==='day' ? dayCodes(getDay(S.ui.day)).s : [];
  modal(`<div class="modal-head"><div><span class="label">${esc(age)} · ${({day:'Günlük plan',month:'Aylık plan',anek:'Anekdot kaydı · gözlenen beceriler'})[S.ui.pickT]}</span><h2>Süreç bileşeni seç</h2></div><button class="icon-btn" data-do="mclose" aria-label="Kapat">✕</button></div>

    <div class="toolbar"><button class="btn primary" data-do="mclose">Tamam</button></div>
  </div>`);
}

function readMonthForm(i){
  const m=S.year[i]; m.baslik=$('#em-b').value; m.ozet=$('#em-o').value;
  m.weeks=m.weeks.map((w,j)=>({baslik:$('#em-wb'+j).value,tema:$('#em-wt'+j).value}));
