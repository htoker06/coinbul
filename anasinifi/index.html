let toastT;
function toast(msg){clearTimeout(toastT);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;toastT=setTimeout(()=>el.remove(),2600)}

/* ---------- Çizim ---------- */
const VIEWS={home:vHome,year:vYear,month:vMonth,day:vDay,gen:vGen,bank:vBank,anek:vDeger,set:vSet};
const grow = t => { t.style.height='auto'; t.style.height=(t.scrollHeight+4)+'px'; };
function render(keepScroll){ const y=window.scrollY; renderNav(); $('#view').innerHTML=classBar()+VIEWS[S.ui.view](); document.querySelectorAll('#view textarea').forEach(grow); window.scrollTo(0,keepScroll?y:0); }
function go(v){S.ui.view=v;save();render();}

/* ---------- Olaylar ---------- */
function addToDay(k,a){const p=getDay(k);p.acts.push({...a,id:uid()});save(); if(a.yas!==AGE()) setTimeout(()=>toast(`Not: bu etkinlik ${a.yas} için hazırlanmıştı; kodları o yaş grubuna göredir.`),2700);}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){closeModal();go(g.dataset.go);return}
  const b=e.target.closest('[data-do]'); if(!b) return;
  const d=b.dataset.do;
  if(d==='mclose'){ if(b.classList.contains('modal-bg')&&e.target!==b) return; const wasPick=!!$('.pick-list'); closeModal(); if(wasPick) render(true); return; }
  const id=b.dataset.id, ctx=b.dataset.ctx; const day=()=>getDay(S.ui.day);
  switch(d){
    case 'print': window.print(); break;
    case 'detail': {const a=findAct(ctx,id); if(a) detailModal(a,ctx); break;}
    case 'save': {const a=findAct(ctx,id); if(a){S.bank.unshift({...a,id:uid()});save();toast('Etkinlik bankaya kaydedildi');} break;}
    case 'saveall': S.gen.forEach(a=>S.bank.unshift({...a,id:uid()})); save(); toast(`${S.gen.length} etkinlik bankaya kaydedildi`); break;
    case 'del': S.bank=S.bank.filter(a=>a.id!==id); save(); render(true); toast('Etkinlik silindi'); break;
    case 'regen': {const i=S.gen.findIndex(a=>a.id===id); const a=S.gen[i]; S.gen[i]=generate({alan:a.alan,tema:a.tema,yas:a.yas,ortam:a.ortam,avoid:[a.tpl]}); save(); render(true); break;}
    case 'addplan': addPlanModal(ctx,id); break;
    case 'apgo': {const a=findAct(ctx,id); const k=$('#ap-date').value; if(!k){toast('Lütfen bir tarih seçin');break;} addToDay(k,a); closeModal(); toast(`${fmtShort(k)} planına eklendi`); if(b.dataset.open){S.ui.day=k;go('day');} break;}
    case 'galan': S.ui.gen.alan=b.dataset.v; save(); render(true); break;
    case 'generate': case 'genmore': {
      const g=S.ui.gen; g.tema=$('#g-tema').value; g.yas=$('#g-yas').value; g.ortam=$('#g-ortam').value; g.adet=+$('#g-adet').value;
      const list=[]; const used=[];
      for(let i=0;i<g.adet;i++){const al=g.alan==='KARMA'?ALAN_KEYS[(i+Math.floor(Math.random()*7))%7]:g.alan; const a=generate({alan:al,tema:g.tema,yas:g.yas,ortam:g.ortam,avoid:used}); used.push(a.tpl); list.push(a);}
      S.gen = d==='genmore' ? [...S.gen,...list] : list; save(); render(true); toast(`${list.length} yeni etkinlik üretildi`); break;}
    case 'genclear': S.gen=[]; save(); render(true); break;
    case 'genfor': S.ui.gen.tema=b.dataset.tema; S.ui.gen.yas=AGE(); S.gen=Array.from({length:7},(_,i)=>generate({alan:ALAN_KEYS[i],tema:b.dataset.tema})); go('gen'); break;
    case 'bf': S.ui.bankF=b.dataset.v; render(true); break;
    case 'bY': S.ui.bankY=b.dataset.v; save(); render(true); break;
    case 'ytab': S.ui.yTab=b.dataset.v; save(); render(true); break;
    case 'allmonths': S.year.forEach(m=>getMonth(m.key)); render(true); toast('Tüm ayların planı oluşturuldu'); break;
    case 'openmonth': S.ui.month=b.dataset.key; go('month'); break;
    case 'openday': S.ui.day=b.dataset.key; go('day'); break;
    case 'editmonth': editMonthModal(+b.dataset.i); break;
    case 'emdeg': case 'emodak': {const m=S.year[+$('[data-do="emsave"]').dataset.i]; const f=d==='emdeg'?'deger':'odak'; const v=b.dataset.v; m[f]=m[f].includes(v)?m[f].filter(x=>x!==v):[...m[f],v]; b.setAttribute('aria-pressed',m[f].includes(v)); break;}
    case 'emaddw': {const i=+b.dataset.i; readMonthForm(i); S.year[i].weeks.push({baslik:'Yeni hafta',tema:'okul'}); editMonthModal(i); break;}
    case 'emdelw': {const i=+b.dataset.i; readMonthForm(i); S.year[i].weeks.pop(); editMonthModal(i); break;}
    case 'emsave': {const i=+b.dataset.i; readMonthForm(i); save(); closeModal(); render(true); toast('Ay planı güncellendi'); break;}
    case 'resetyear': S.year=yearFor(S.settings.baslangic,AGE()); S.monthly={}; save(); render(true); toast('Yıllık plan varsayılan temalara döndü'); break;
    case 'tog': {const M=getMonth(S.ui.month); const f=b.dataset.f, v=b.dataset.v; M.sel[f]=M.sel[f].includes(v)?M.sel[f].filter(x=>x!==v):[...M.sel[f],v]; save(); render(true); break;}
    case 'remonth': {const old=S.monthly[S.ui.month]; const nm=newMonth(S.ui.month); if(old){['uyg','zen','des','aile','kanit','cocuk','program','ogretmen','yansitma'].forEach(f=>nm[f]=old[f])} S.monthly[S.ui.month]=nm; save(); render(true); toast('Seçimler haftalık temalara göre yeniden önerildi'); break;}
    case 'pick': S.ui.pickT=b.dataset.target; pickModal(); break;
    case 'pickA': S.ui.pickA=b.dataset.v; pickModal(); break;
    case 'fillmonth': {const [y,mm]=S.ui.month.split('-').map(Number); let n=0; for(let dd=1;dd<=new Date(y,mm,0).getDate();dd++){const dt=new Date(y,mm-1,dd); if(dt.getDay()===0||dt.getDay()===6) continue; const k=dkey(dt); if(!S.daily[k]||!S.daily[k].acts.length){S.daily[k]=newDay(k,true);n++;}} save(); render(true); toast(n?`${n} iş gününe plan oluşturuldu`:'Tüm iş günlerinde zaten plan var'); break;}
    case 'dayshift': {const dt=pdate(S.ui.day); dt.setDate(dt.getDate()+(+b.dataset.n)); S.ui.day=dkey(dt); save(); render(); break;}
    case 'autoday': {const k=S.ui.day; const old=S.daily[k]; const nd=newDay(k,true); if(old){nd.degEk=old.degEk;nd.notlar=old.notlar} S.daily[k]=nd; save(); if(S.ui.view!=='day'){go('day')}else render(true); toast('Plan haftanın temasına göre oluşturuldu'); break;}
    case 'clearday': delete S.daily[S.ui.day]; save(); render(true); toast('Günün planı temizlendi'); break;
    case 'addnew': {const p=day(); const used=p.acts.map(a=>a.alan); const free=ALAN_KEYS.filter(a=>!used.includes(a)); p.acts.push(generate({alan:rnd(free.length?free:ALAN_KEYS),tema:p.tema})); save(); render(true); toast('Yeni etkinlik eklendi'); break;}
    case 'frombank': bankModal(); break;
    case 'bpick': {const a=S.bank.find(x=>x.id===id); addToDay(S.ui.day,a); closeModal(); render(true); toast('Etkinlik plana eklendi'); break;}
    case 'up': case 'down': {const p=day(); const i=p.acts.findIndex(a=>a.id===id); const j=d==='up'?i-1:i+1; if(j<0||j>=p.acts.length)break; [p.acts[i],p.acts[j]]=[p.acts[j],p.acts[i]]; save(); render(true); break;}
    case 'rm': {const p=day(); p.acts=p.acts.filter(a=>a.id!==id); save(); render(true); break;}
    case 'swap': {const p=day(); const i=p.acts.findIndex(a=>a.id===id); const a=p.acts[i]; p.acts[i]=generate({alan:a.alan,tema:p.tema,yas:a.yas,ortam:a.ortam,avoid:[a.tpl]}); save(); render(true); toast('Etkinlik başka bir fikirle değiştirildi'); break;}
    case 'msave': {const a=findAct(ctx,id); const box=$('.modal');
      box.querySelectorAll('[data-ef]').forEach(el=>{const f=el.dataset.ef; let v=el.innerText.trim(); if(f==='adim') v=resolveText(a.yas,fromPlain(v)); if(el.dataset.i!==undefined){a[f][+el.dataset.i]=v}else a[f]=v;});
      save(); closeModal(); render(true); toast('Etkinlik kaydedildi'); break;}
    case 'exp': {const t=$('#s-json'); t.value=JSON.stringify(S); t.select(); try{navigator.clipboard.writeText(t.value).then(()=>toast('Veriler panoya kopyalandı'),()=>toast('Veriler seçildi; kopyalamak için Ctrl+C'))}catch(err){toast('Veriler seçildi; kopyalamak için Ctrl+C')} break;}
    case 'dl': saveFile(`minik-adimlar-yedek-${dkey(new Date())}.json`,new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); break;
    case 'word': exportWord(b.dataset.kind, b.dataset.kind==='day'?S.ui.day:b.dataset.kind==='month'?S.ui.month:id); break;
    case 'anekfor': {const d=newAnek(); d.tarih=S.ui.day; S.ui.anekDraft=d; go('anek'); break;}
    case 'akod': {const d=anekDraft(); const v=b.dataset.v; d.kodlar=d.kodlar.includes(v)?d.kodlar.filter(x=>x!==v):[...d.kodlar,v]; save(); render(true); break;}
    case 'asave': {const d=anekDraft(); if(!d.cocuk.trim()){toast('Çocuğun adını yazın');$('#a-cocuk').focus();break;} if(!d.durum.trim()){toast('Gözlenen durumu yazın');$('#a-durum').focus();break;}
      const rec={...d,cocuk:d.cocuk.trim(),kodlar:d.kodlar.slice()}; if(d.id){const i=S.anek.findIndex(x=>x.id===d.id); if(i>=0) S.anek[i]=rec; else S.anek.push(rec);} else {rec.id=uid(); S.anek.push(rec);}
      const keep={mekan:d.mekan,tarih:d.tarih}; S.ui.anekDraft={...newAnek(),...keep}; save(); render(true); toast(d.id?'Kayıt güncellendi':'Anekdot kaydı eklendi'); break;}
    case 'anew': case 'aclear': S.ui.anekDraft=newAnek(); save(); render(true); break;
    case 'af': S.ui.anekF=b.dataset.v; save(); render(true); break;
    case 'dtab': S.ui.dTab=b.dataset.v; save(); render(true); break;
    case 'rapD': S.ui.rapD=+b.dataset.v; save(); render(true); break;
    case 'rapC': S.ui.rapC=b.dataset.v; save(); render(true); break;
    case 'rapset': {const c=rapCur(); const R=rapData(c.child,c.dn); const k=b.dataset.c; if(R.not[k]===b.dataset.v) delete R.not[k]; else R.not[k]=b.dataset.v; save(); render(true); break;}
    case 'rlist': {S.cocuklar=uniq($('#r-list').value.split('\n').map(s=>s.trim())); save(); render(true); toast('Çocuk listesi kaydedildi'); break;}
    case 'olcut': {const M=getMonth(S.ui.month); const f=b.dataset.f; const t=OLCUT[f][+b.dataset.i]; const cur=(M[f]||'').trim(); if(cur===AY_METIN[f]) M[f]=t; else if(!cur.includes(t)) M[f]=(cur?cur+' ':'')+t; save(); render(true); break;}
    case 'clsopen': switchClass(id); break;
    case 'clsadd': {const a2=b.dataset.v; const n=S.siniflar.filter(x=>x.yas===a2).length; const c={id:'c'+uid(),ad:`Anasınıfı (${a2})${n?' '+(n+1):''}`,yas:a2}; S.siniflar.push(c); save(); render(true); toast(`${c.ad} eklendi`); break;}
    case 'clsdel': {const c=S.siniflar.find(x=>x.id===id); $('#cls-confirm').innerHTML=`<div class="note" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">"${esc(c.ad)}" sınıfı ve tüm planları silinsin mi? <button class="btn sm danger" data-do="clsdel2" data-id="${id}">Evet, sil</button><button class="btn sm ghost" data-do="clsdel0">Vazgeç</button></div>`; break;}
    case 'clsdel0': $('#cls-confirm').innerHTML=''; break;
    case 'clsdel2': S.siniflar=S.siniflar.filter(x=>x.id!==id); delete S.sdata[id]; save(); render(true); toast('Sınıf silindi'); break;
    case 'aedit': {const r=S.anek.find(x=>x.id===id); S.ui.anekDraft={...r,kodlar:r.kodlar.slice()}; save(); render(); break;}
    case 'adel': $('#adel-'+id).innerHTML=`<div class="note" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">Bu kayıt silinsin mi? <button class="btn sm danger" data-do="adel2" data-id="${id}">Evet, sil</button><button class="btn sm ghost" data-do="adel0" data-id="${id}">Vazgeç</button></div>`; break;
    case 'adel0': $('#adel-'+id).innerHTML=''; break;
    case 'adel2': S.anek=S.anek.filter(x=>x.id!==id); if(anekDraft().id===id) S.ui.anekDraft=newAnek(); save(); render(true); toast('Kayıt silindi'); break;
    case 'imp': {try{const o=JSON.parse($('#s-json').value); if(!o.year||!o.settings||o.v!==2) throw 0; S=o; migrateClasses(); save(); render(); toast('Veriler geri yüklendi');}catch(err){toast('Yedek okunamadı: kutudaki metin bu uygulamanın yedeği olmalı');} break;}
    case 'reset': $('#reset-confirm').innerHTML='<div class="note" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">Tüm planlar ve banka silinecek. Emin misiniz? <button class="btn sm danger" data-do="reset2">Evet, sıfırla</button><button class="btn sm ghost" data-do="reset0">Vazgeç</button></div>'; break;
    case 'reset0': $('#reset-confirm').innerHTML=''; break;
    case 'reset2': try{localStorage.removeItem(KEY)}catch(err){} seed(); save(); render(); toast('Uygulama sıfırlandı'); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target; const bind=t.dataset.bind;
  if(t.tagName==='TEXTAREA') grow(t);
  if(bind){const [scope,...path]=bind.split('.'); let obj= scope==='day'?getDay(S.ui.day): scope==='month'?getMonth(S.ui.month): scope==='anek'?anekDraft(): scope==='rap'?(()=>{const c=rapCur();return rapData(c.child,c.dn)})(): S.settings;
    for(let i=0;i<path.length-1;i++) obj=obj[path[i]]; obj[path[path.length-1]]=t.value; save(); if(scope==='set') renderNav(); return;}
  if(t.dataset.cls&&t.dataset.cf==='ad'){const c=S.siniflar.find(x=>x.id===t.dataset.cls); c.ad=t.value; if(c.id===S.aktif) S.settings.sinif=t.value; save(); renderNav(); return;}
  if(t.id==='bq'||t.id==='pq'){ if(t.id==='bq') S.ui.bankQ=t.value; else S.ui.progQ=t.value; const id=t.id,pos=t.selectionStart; render(true); const n=$('#'+id); n.focus(); n.setSelectionRange(pos,pos);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pick){const set=pickTarget(); const c=t.dataset.pick; const i=set.indexOf(c); if(t.checked&&i<0) set.push(c); if(!t.checked&&i>=0) set.splice(i,1); save(); return;}
  if(t.id==='cls'){switchClass(t.value);return;}
  if(t.dataset.cls&&t.dataset.cf==='yas'){const c=S.siniflar.find(x=>x.id===t.dataset.cls); c.yas=t.value; if(c.id===S.aktif){S.settings.yas=t.value;S.ui.gen.yas=t.value;} save(); render(true); toast(`${c.ad} artık ${t.value}. Aylık planda "Seçimleri yeniden öner" ile bu yaşa uygun öneri alın.`); return;}
  if(t.id==='msel'){S.ui.month=t.value;save();render();}
  else if(t.id==='a-tarih'&&t.value){anekDraft().tarih=t.value;save();render(true);}
  else if(t.id==='dsel'&&t.value){S.ui.day=t.value;save();render();}
  else if(t.id==='dtema'){const p=getDay(S.ui.day);p.tema=t.value;p.haftaBaslik=TEMA[t.value].ad;save();render(true);}
  else if(t.id==='g-tema'){S.ui.gen.tema=t.value;save();}
  else if(t.id==='p-age'){S.ui.progAge=t.value;render(true);}
  else if(t.id==='s-yas'){S.settings.yas=t.value;S.ui.gen.yas=t.value;save();renderNav();toast('Yaş grubu değişti. Aylık planda "Seçimleri yeniden öner" ile bu yaşa uygun öneri alabilirsiniz.');}
  else if(t.id==='s-yil'){const y=+t.value; if(y!==S.settings.baslangic){S.settings.baslangic=y;S.year=yearFor(y,AGE());S.monthly={};Object.keys(S.sdata).forEach(id=>{const c=S.siniflar.find(x=>x.id===id);if(c){S.sdata[id].year=yearFor(y,c.yas);S.sdata[id].monthly={};}});save();render(true);toast(`${y}-${y+1} yılı temaları yüklendi`);}}
  else if(t.id==='s-file'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#s-json').value=r.result;toast('Dosya okundu; "Geri yükle"ye dokunun')};r.readAsText(t.files[0]);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const wasPick=!!$('.pick-list');closeModal();if(wasPick)render(true);}});

/* ---------- Başlat ---------- */
S = load() || seed(); migrateClasses(); save();
const h=(location.hash||'').slice(1); if(VIEWS[h]) S.ui.view=h;
render();

</script>
</body>
