<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minik Adımlar Planlayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Düzen: solda pastel boya kutusu gibi menü, sağda "pano" — plan kâğıtları ve renkli etkinlik kartları. Telefonda menü alt çubuğa iner. */
:root{
  --bg:#F1F6F5;           /* hafif nane tonlu zemin */
  --paper:#FFFFFF;
  --paper-2:#F7FAF9;
  --ink:#1C2840;          /* lacivert mürekkep */
  --ink-2:#55617A;
  --line:#DCE5E4;
  --accent:#2C6FD6;       /* mavi pastel boya */
  --accent-ink:#FFFFFF;
  --sun:#F4B23A;
  --soft:#E7EFFC;
  --ok:#2F9E6A;
  --warn:#D9822B;
  --c-ta:#E0517A; --c-ma:#2C6FD6; --c-fa:#2F9E6A; --c-sa:#E9792E;
  --c-hsa:#14A0A6; --c-sna:#8B5AD6; --c-msa:#D69A12;
  --shadow:0 1px 2px rgba(28,40,64,.06),0 6px 18px rgba(28,40,64,.07);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121822; --paper:#1A2230; --paper-2:#1F2938; --ink:#E9EEF7; --ink-2:#A3AEC2; --line:#2C3748;
  --accent:#6EA2F5; --accent-ink:#0F1622; --sun:#F2BE5B; --soft:#22324B; --ok:#55C792; --warn:#F0A256;
  --c-ta:#F27A9C; --c-ma:#6EA2F5; --c-fa:#55C792; --c-sa:#F39A5B; --c-hsa:#3CC5CA; --c-sna:#AE88EC; --c-msa:#E9B73E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121822; --paper:#1A2230; --paper-2:#1F2938; --ink:#E9EEF7; --ink-2:#A3AEC2; --line:#2C3748;
  --accent:#6EA2F5; --accent-ink:#0F1622; --sun:#F2BE5B; --soft:#22324B; --ok:#55C792; --warn:#F0A256;
  --c-ta:#F27A9C; --c-ma:#6EA2F5; --c-fa:#55C792; --c-sa:#F39A5B; --c-hsa:#3CC5CA; --c-sna:#AE88EC; --c-msa:#E9B73E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.12rem} h4{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--ink-2)}

/* ---------- Kabuk ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:42px;height:42px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.2rem;line-height:1}
.brand span{display:block;font-size:.75rem;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--ink-2);text-align:left}
.nav button svg{width:22px;height:22px;flex:none}
.nav button:hover{background:var(--paper-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--accent)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--ink-2);padding:0 8px}
.main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:24px 60px}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head p{max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--c-ta);color:var(--c-ta)}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:transparent;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--paper-2);color:var(--ink)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:800;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],select,textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink)}
.chip.code{font-variant-numeric:tabular-nums}
.chip.alan{background:color-mix(in srgb,var(--ac) 14%,var(--paper));border-color:color-mix(in srgb,var(--ac) 40%,var(--line));color:color-mix(in srgb,var(--ac) 75%,var(--ink))}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .x{opacity:.6;cursor:pointer}

/* ---------- Tema bannerı ---------- */
.banner{position:relative;overflow:hidden;border-radius:20px;background:var(--th);color:#fff;padding:26px 26px 30px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;isolation:isolate}
.banner::before{content:"";position:absolute;inset:auto -10% -55% -10%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);z-index:-1}
.banner svg.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:60px;z-index:-1}
.banner .eyebrow{font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.banner h1,.banner h2{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.banner p{max-width:58ch;opacity:.95;font-weight:600}
.floaters{position:absolute;right:10px;top:8px;bottom:8px;width:min(46%,380px);z-index:-1;pointer-events:none}
.floaters span{position:absolute;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));line-height:1}
.em-flag{display:inline-block;width:1.25em;height:.84em;vertical-align:-.08em}

/* ---------- Etkinlik kartları ---------- */
.act{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.act-vis{position:relative;height:104px;background:color-mix(in srgb,var(--ac) 18%,var(--paper));display:flex;align-items:center;justify-content:center;gap:6px;font-size:2.4rem;overflow:hidden}
.act-vis::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:radial-gradient(circle at 10px -2px,transparent 9px,var(--paper) 10px) repeat-x;background-size:20px 10px}
.act-vis span:nth-child(2){font-size:3.2rem;transform:translateY(-4px)}
.act-vis span:nth-child(1){transform:rotate(-10deg)}
.act-vis span:nth-child(3){transform:rotate(9deg)}
.act-vis .alan-badge{position:absolute;left:10px;top:10px;font-size:.72rem;font-weight:800;background:var(--ac);color:#fff;padding:3px 9px;border-radius:999px;letter-spacing:.02em;transform:none}
.act-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.act-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--ink-2);font-weight:700}
.act-sum{font-size:.9rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act-mat{display:flex;flex-wrap:wrap;gap:4px}
.act-mat span{font-size:1.15rem;background:var(--paper-2);border-radius:8px;padding:1px 5px}
.act-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}

/* ---------- Ana sayfa ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-family:var(--f-display);font-size:1.9rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);cursor:pointer}
.quick button:hover{border-color:var(--accent)}
.quick .q-em{font-size:1.8rem}
.quick b{font-family:var(--f-display);font-size:1.02rem}

/* ---------- Günlük akış ---------- */
.flow{display:flex;flex-direction:column;gap:0}
.flow-step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.flow-step::before{content:"";position:absolute;left:27px;top:52px;bottom:0;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.flow-step:last-child::before{display:none}
.flow-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--fc) 16%,var(--paper));color:var(--fc);border:2px solid color-mix(in srgb,var(--fc) 35%,transparent)}
.flow-ic svg{width:30px;height:30px}
.flow-body{min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.flow-body h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow-body h3 small{font-family:var(--f-body);font-size:.75rem;font-weight:700;color:var(--ink-2)}
.flow-body textarea{min-height:58px}

.plan-act{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.plan-act-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:color-mix(in srgb,var(--ac) 12%,var(--paper))}
.plan-act-em{font-size:1.9rem;letter-spacing:-.15em;white-space:nowrap}
.plan-act-head h4{font-size:1.02rem}
.plan-act-body{padding:12px 14px;display:grid;gap:10px}
.plan-act-body ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.mini-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-bottom:1px solid var(--line)}
.sheet-head div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.sheet-head div:last-child{border-right:0}
.sheet-head b{display:block;font-size:.95rem}
.sec{padding:18px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec:last-child{border-bottom:0}
.sec-title{display:flex;align-items:center;gap:10px}
.sec-title .num{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:.82rem;flex:none}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 14px;align-items:start}
.kv>dt{font-weight:800;font-size:.85rem;color:var(--ink-2);padding-top:3px}
.kv>dd{margin:0;min-width:0}
.outcome{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.outcome:last-child{border-bottom:0}

/* ---------- Yıllık ---------- */
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mcard-top{background:var(--th);color:#fff;padding:14px 16px 18px;position:relative;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;isolation:isolate}
.mcard-top .big{position:absolute;right:10px;top:6px;font-size:2.6rem;z-index:-1;opacity:.95}
.mcard-top .big span{display:inline-block}
.mcard-top .m{font-weight:800;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.mcard-top h3{color:#fff;font-size:1.25rem}
.mcard-body{padding:14px 16px;display:grid;gap:10px;flex:1}
.wk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-size:.88rem}
.wk .n{font-size:.7rem;font-weight:800;color:var(--ink-2);background:var(--paper-2);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.days-list{display:grid;gap:3px;font-size:.84rem}
.days-list li{list-style:none}
.days-list ul{margin:0;padding:0}
.mcard-foot{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}

/* ---------- Aylık ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.72rem;font-weight:800;color:var(--ink-2);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.cal button.day{min-height:84px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal button.day:hover{border-color:var(--accent)}
.cal .day.out{opacity:.35}
.cal .day.we{background:var(--paper-2)}
.cal .day.today{border:2px solid var(--accent)}
.cal .day .dn{font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem}
.cal .day .de{font-size:1.05rem;line-height:1.1;overflow:hidden;white-space:nowrap}
.cal .day .dt{font-size:.66rem;color:var(--c-ta);font-weight:800;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.week{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.week-top{background:color-mix(in srgb,var(--th) 85%,#000 0%);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.week-top .em{font-size:1.6rem;white-space:nowrap}
.week-body{padding:12px 14px;display:grid;gap:8px;font-size:.88rem;flex:1}
.alan-block{border-left:4px solid var(--ac);padding:4px 0 4px 12px;display:grid;gap:6px}

/* ---------- Üretici ---------- */
.gen-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;align-items:end}
.alan-pick{display:flex;flex-wrap:wrap;gap:6px}
.alan-pick button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.alan-pick button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}

/* ---------- Modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,34,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--paper);border-radius:20px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);z-index:1}
.modal-body{padding:18px;display:grid;gap:16px}
.detail-vis{border-radius:16px;height:150px;font-size:3.6rem}
.detail-vis::after{display:none}
[contenteditable="true"]{border-radius:6px;padding:1px 4px;margin:-1px -4px}
[contenteditable="true"]:hover{background:var(--paper-2)}
[contenteditable="true"]:focus{outline:2px solid var(--accent);background:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--ink-2)}
.empty .em{font-size:2.4rem}
.note{font-size:.82rem;color:var(--ink-2);background:var(--paper-2);border-radius:10px;padding:10px 12px;border:1px dashed var(--line)}
table.otbl{width:100%;border-collapse:collapse;font-size:.88rem}
.otbl td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
.otbl input{padding:5px 8px}
.tbl-wrap{overflow-x:auto}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:40;gap:0}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between;gap:2px}
  .nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:.62rem;flex:1;align-items:center;text-align:center;border-radius:10px}
  .main{padding-bottom:110px}
  .today-grid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv>dt{padding-top:6px}
  .cal button.day{min-height:58px;padding:4px}
  .cal .day .dt{display:none}
  .floaters{opacity:.55}
  h1{font-size:1.6rem}
}
@media (max-width:480px){.stat-row{grid-template-columns:repeat(3,minmax(0,1fr))}.stat b{font-size:1.4rem}.cal{gap:3px}.cal .day .de{font-size:.8rem}}
@media (prefers-reduced-motion:no-preference){
  .act,.mcard{transition:transform .15s ease,box-shadow .15s ease}
  .act:hover,.mcard:hover{transform:translateY(-2px)}
}
@media print{
  .side,.toolbar,.no-print,.act-actions,.btn,.icon-btn{display:none!important}
  .app{display:block} .main{padding:0} body{background:#fff}
  .panel,.sheet,.plan-act{break-inside:avoid}
  textarea{border:0;resize:none;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="3" width="42" height="42" rx="13" fill="#F4B23A"/><circle cx="17" cy="20" r="4.2" fill="#1C2840"/><circle cx="31" cy="20" r="4.2" fill="#1C2840"/><path d="M15 29c3 5 15 5 18 0" stroke="#1C2840" stroke-width="3.2" fill="none" stroke-linecap="round"/><circle cx="12" cy="27" r="3" fill="#E0517A" opacity=".55"/><circle cx="36" cy="27" r="3" fill="#E0517A" opacity=".55"/></svg>
      <div><b>Minik Adımlar</b><span>Anasınıfı planlayıcı</span></div>
    </div>
    <nav class="nav" id="nav"></nav>

const AILE = th => [
  `Ailelerden çocuklarıyla birlikte ${th.ad} temalı bir nesne ya da resim bularak sınıfa göndermeleri istenir.`,
  `Aileler akşam yemeğinde "${th.soru}" sorusunu çocuklarına sorar ve cevabı not alıp gönderir.`,
  `Ailelerle birlikte evde ${th.ad} konulu kısa bir hikâye okunması ve en sevilen sayfanın resmedilmesi önerilir.`,
  `Bir aile büyüğü, ${th.ad} ile ilgili deneyimini paylaşmak üzere sınıfa davet edilir.`
];

function generate(opt){
  const alan = (!opt.alan || opt.alan==='KARMA') ? rnd(ALAN_KEYS) : opt.alan;
  const th = TEMA[opt.tema] || TEMA.okul;
  const yas = opt.yas || S.settings.yas;
  const l = lvlOf(yas);
  const o = shuffle(th.n);
  const c = {th,l,yas,N:[5,10,20][l],o0:o[0],o1:o[1],o2:o[2],o3:o[3],o4:o[4]||o[0],n0:o[0][0],n1:o[1][0],n2:o[2][0],tk:rnd(th.t),
    pat:[ `${o[0][0]} - ${o[1][0]} - ${o[0][0]} - ${o[1][0]} - ?`, `${o[0][0]} - ${o[1][0]} - ${o[1][0]} - ${o[0][0]} - ${o[1][0]} - ${o[1][0]} - ?`, `${o[0][0]} - ${o[1][0]} - ${o[2][0]} - ${o[0][0]} - ${o[1][0]} - ?`][l]};
  let pool = T[alan];
  if (opt.avoid) { const f = pool.filter((_,i)=>!opt.avoid.includes(alan+i)); if (f.length) pool=f; }
  const idx = T[alan].indexOf(rnd(pool));
  const r = T[alan][idx](c);
  const mats = uniq(r.mat.map(m => typeof m==='string' ? (MAT[m]?MAT[m][0]+'|'+MAT[m][1]:null) : m.raw ? m.raw.join('|') : `${cap(m[0])}${/kart|resim/.test(m[0])?'':' resimleri / maketi'}|${m[1]}`)).map(s=>s.split('|'));
  const sure = opt.sure || ['15-20 dk','20-25 dk','25-30 dk'][l];
  return {
    id:uid(), tpl:alan+idx, alan, tema:opt.tema, temaAd:th.ad, yas, sure, ortam:r.ortam||opt.ortam||'Sınıf',
    ad:r.ad, tur:r.tur, gorsel:[o[0][1],o[1][1],o[2][1]], mat:mats,
    kavram: shuffle(th.k).slice(0,2), sozcuk: shuffle(th.s).slice(0,3),
    cikti:r.cikti, kb:r.kb, eg:r.eg, sdb:r.sdb, dg:r.dg, ob:r.ob,
    giris:r.giris, adim:r.adim, soru:r.soru, destek:r.destek, zengin:r.zengin,
    aile: rnd(AILE(th)), olusturma: new Date().toISOString()
  };
}

/* ---------- Plan yardımcıları ---------- */
function yearMonths(){return S.year}
function monthOf(key){return S.year.find(m=>m.key===key)}
function schoolWeeks(key){
  const [y,m]=key.split('-').map(Number); const first=new Date(y,m-1,1); const last=new Date(y,m,0);
  const d=new Date(first); d.setDate(d.getDate()-((d.getDay()+6)%7)); const weeks=[];
  while(d<=last){const fri=new Date(d);fri.setDate(fri.getDate()+4); if(fri>=first) weeks.push(dkey(d)); d.setDate(d.getDate()+7);}
  // ayın ilk iş günü cumartesi/pazar ise oluşan boş haftayı at
  return weeks.filter(w=>{const mon=pdate(w);for(let i=0;i<5;i++){const x=new Date(mon);x.setDate(x.getDate()+i);if(x.getMonth()===m-1)return true}return false});
}
function weekInfo(dateK){
  const d=pdate(dateK); const mo=monthOf(mkey(d));
  if(!mo) return {mo:null,i:0,w:{baslik:'Serbest tema',tema:'okul'}};
  const mon=new Date(d); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  let i=schoolWeeks(mo.key).indexOf(dkey(mon)); if(i<0)i=0;
  return {mo,i,w:mo.weeks[Math.min(i,mo.weeks.length-1)]};
}
const ROT=[['TA','HSA','SNA'],['MA','MSA','SA'],['FA','TA','HSA'],['SNA','MA','MSA'],['SA','FA','HSA']];
function newDay(dateK, withActs=true){

  const rot=ROT[Math.max(0,Math.min(4,(d.getDay()+6)%7))];

  return {

      acikhava:`Hava uygunsa bahçede "${rnd(th.t)}" taklit oyunu ve serbest oyun oynanır; hava uygun değilse salonda hareket oyunları yapılır.`,
      degerlendirme:`Gün boyunca yapılanlar resimli akış kartlarıyla hatırlanır: "Bugün en çok neyi sevdin?", "${th.ad} hakkında yeni ne öğrendin?" Çocuklar duygu kartıyla günün duygusunu seçer.`,

    },

  };
}
function newMonth(key){
  const mo=monthOf(key); const sel={cikti:[],kb:[],eg:[],sdb:[],dg:[...(mo?mo.deger:[])],ob:[]};
  if(mo){ // haftalık temalardan örnek etkinliklerle seçili bileşenleri doldur
    const samp=[]; mo.weeks.forEach(w=>{['TA','MA','FA','SNA','HSA','MSA','SA'].forEach(a=>{const x=generate({alan:a,tema:w.tema});samp.push(x)})});
    const top=(arr,n)=>{const cnt={};arr.forEach(x=>cnt[x]=(cnt[x]||0)+1);return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0])};
    sel.cikti=top(samp.flatMap(x=>x.cikti),16); sel.kb=top(samp.flatMap(x=>x.kb),6); sel.eg=top(samp.flatMap(x=>x.eg),5);
    sel.sdb=top(samp.flatMap(x=>x.sdb),4); sel.ob=top(samp.flatMap(x=>x.ob),3); sel.dg=uniq([...sel.dg,...top(samp.flatMap(x=>x.dg),2)]);
  }
  const th=mo?TEMA[mo.weeks[0].tema]:TEMA.okul;
  return {sel,
    aile: mo ? `Ay başında aile bülteni gönderilir: "${mo.baslik}" temasında yapılacak çalışmalar, belirli gün ve haftalar paylaşılır. ${AILE(th)[0]} Ay sonunda çocukların ürünleri bir "aile sergisi" ile paylaşılır.` : '',

    notlar:''};
}

    <div class="week-body"><span class="small muted">Tema: ${esc(t2.ad)}</span><div class="chips">${t2.k.slice(0,3).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div>
    <div class="toolbar"><button class="btn sm" data-do="genfor" data-tema="${w.tema}">✨ Etkinlik üret</button>${wk?`<button class="btn sm" data-do="openday" data-key="${wk}">Haftayı aç</button>`:''}</div></div></article>`}).join('')}</section>
  <section class="panel" style="display:grid;gap:12px"><div class="page-head"><h2>Takvim</h2><span class="small muted">Bir güne dokunarak günlük planını açın. Etkinlik eklenen günlerde görseller görünür.</span></div>
    <div class="cal">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div></section>

    <div class="sec"><div class="sec-title"><span class="num">1</span><h3>Alan Becerileri ve Öğrenme Çıktıları</h3></div><p class="small muted">Bu ay odaklanacağınız çıktıları seçin; seçimler günlük plan önerilerine kaynak olur.</p><div class="grid" style="gap:14px">${byAlan}</div></div>

    <div class="sec"><div class="sec-title"><span class="num">3</span><h3>Eğilimler</h3></div>${togs('eg',EGILIM)}</div>
    <div class="sec"><div class="sec-title"><span class="num">4</span><h3>Programlar Arası Bileşenler</h3></div>
      <dl class="kv"><dt>Sosyal-duygusal öğrenme becerileri</dt><dd>${togs('sdb',SDB)}</dd><dt>Değerler</dt><dd>${togs('dg',DEGER)}</dd><dt>Okuryazarlık becerileri</dt><dd>${togs('ob',OB)}</dd></dl></div>
    <div class="sec"><div class="sec-title"><span class="num">5</span><h3>İçerik Çerçevesi</h3></div>
      <dl class="kv"><dt>Kavramlar</dt><dd><div class="chips">${kav.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></dd><dt>Sözcükler</dt><dd><div class="chips">${soz.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></dd>
      <dt>Belirli gün ve haftalar</dt><dd><ul class="days-list" style="margin:0;padding:0">${mo.gunler.map(g=>`<li>📌 ${esc(g)}</li>`).join('')}</ul></dd></dl></div>
    <div class="sec"><div class="sec-title"><span class="num">6</span><h3>Aile ve Toplum Katılımı</h3></div><textarea id="m-aile" data-bind="month.aile">${esc(M.aile)}</textarea></div>
    <div class="sec"><div class="sec-title"><span class="num">7</span><h3>Değerlendirme</h3></div><textarea id="m-deg" data-bind="month.deg">${esc(M.deg)}</textarea></div>
    <div class="sec"><div class="sec-title"><span class="num">8</span><h3>Notlar</h3></div><textarea id="m-not" data-bind="month.notlar" placeholder="Ay içinde değişen planlar, gözlemler…">${esc(M.notlar)}</textarea></div>

}

/* ---------- Günlük plan ---------- */
const FLOW=[['baslama','Güne Başlama Zamanı','f_basla','var(--sun)','08.30'],['merkez','Öğrenme Merkezlerinde Oyun','f_merkez','var(--c-sna)','09.00'],['beslenme','Beslenme, Toplanma, Temizlik','f_beslen','var(--c-fa)','09.45'],['etk','Etkinlikler','f_etk','var(--accent)','10.15'],['acikhava','Açık Hava / Hareket Zamanı','f_acik','var(--c-hsa)','11.30'],['degerlendirme','Günü Değerlendirme Zamanı','f_deg','var(--c-ta)','12.00'],['evegidis','Eve Gidiş','f_ev','var(--c-sa)','12.20']];
function vDay(){

  const list=f=>uniq(acts.flatMap(a=>a[f]));
  const sdbN=c=>{const s=SDB.find(x=>x[0]===c);return s?`${c} ${s[1]}`:c}; const obN=c=>{const s=OB.find(x=>x[0]===c);return s?`${c} ${s[1]}`:c};
  const mats=[]; acts.forEach(a=>a.mat.forEach(m=>{if(!mats.find(x=>x[0]===m[0]))mats.push(m)}));
  const temaOpts=TEMA_KEYS.map(t=>`<option value="${t}" ${t===p.tema?'selected':''}>${esc(TEMA[t].ad)}</option>`).join('');
  const flowHTML=FLOW.map(([f,ad,ic,col,saat])=>{
    if(f==='etk') return `<div class="flow-step"><div class="flow-ic" style="--fc:${col}">${IC[ic]}</div><div class="flow-body"><h3>${ad} <small>${acts.length} etkinlik · bütünleştirilmiş</small></h3>
      ${acts.length?acts.map((a,i)=>planAct(a,i,acts.length)).join(''):`<div class="empty"><div class="em">✨</div><b>Henüz etkinlik eklenmedi</b><span class="small">Bankadan seçebilir ya da bu güne yeni etkinlik üretebilirsiniz.</span></div>`}
      <div class="toolbar no-print"><button class="btn sm primary" data-do="addnew">${IC.plus} Yeni etkinlik üret</button><button class="btn sm" data-do="frombank">Bankadan ekle</button><button class="btn sm" data-go="gen">Etkinlik üreticiye git</button></div></div></div>`;
    return `<div class="flow-step"><div class="flow-ic" style="--fc:${col}">${IC[ic]}</div><div class="flow-body"><h3>${ad}</h3><textarea id="fl-${f}" data-bind="day.flow.${f}">${esc(p.flow[f])}</textarea></div></div>`;}).join('');
  return `
  <div class="page-head"><div><span class="label">Günlük plan</span><h1>${fmtLong(k)}</h1></div>
   <div class="toolbar"><button class="btn" data-do="dayshift" data-n="-1" aria-label="Önceki gün">‹</button><input type="date" id="dsel" value="${k}" style="width:auto"><button class="btn" data-do="dayshift" data-n="1" aria-label="Sonraki gün">›</button>
   <button class="btn primary" data-do="autoday">✨ Otomatik oluştur</button>${inFrame?'':`<button class="btn" data-do="print">${IC.print} Yazdır</button>`}<button class="btn ghost danger" data-do="clearday">Temizle</button></div></div>
  ${banner(th,`${p.haftaBaslik||th.ad}`,th.ad,`Günün sorusu: ${th.soru}`,'h2')}
  <section class="sheet">
    <div class="sheet-head"><div><span class="label">Okul</span><b>${esc(st.okul||'—')}</b></div><div><span class="label">Sınıf / Yaş</span><b>${esc(st.sinif)} · ${esc(st.yas)}</b></div><div><span class="label">Öğretmen</span><b>${esc(st.ogretmen||'—')}</b></div>
      <div><label class="field"><span>Tema</span><select id="dtema">${temaOpts}</select></label></div></div>
    <div class="sec"><div class="sec-title"><span class="num">1</span><h3>Alan Becerileri</h3></div><div class="chips">${alanlar.length?alanlar.map(alanChip).join(''):'<span class="muted small">Etkinlik eklendiğinde otomatik dolar.</span>'}</div></div>
    <div class="sec"><div class="sec-title"><span class="num">2</span><h3>Kavramsal Beceriler</h3></div><div class="chips">${list('kb').map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'<span class="muted small">—</span>'}</div></div>
    <div class="sec"><div class="sec-title"><span class="num">3</span><h3>Eğilimler</h3></div><div class="chips">${list('eg').map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'<span class="muted small">—</span>'}</div></div>
    <div class="sec"><div class="sec-title"><span class="num">4</span><h3>Programlar Arası Bileşenler</h3></div>
      <dl class="kv"><dt>Sosyal-duygusal öğrenme</dt><dd><div class="chips">${list('sdb').map(x=>`<span class="chip">${esc(sdbN(x))}</span>`).join('')||'—'}</div></dd>
      <dt>Değerler</dt><dd><div class="chips">${list('dg').map(x=>`<span class="chip">💛 ${esc(x)}</span>`).join('')||'—'}</div></dd>
      <dt>Okuryazarlık becerileri</dt><dd><div class="chips">${list('ob').map(x=>`<span class="chip">${esc(obN(x))}</span>`).join('')||'—'}</div></dd></dl></div>
    <div class="sec"><div class="sec-title"><span class="num">5</span><h3>Öğrenme Çıktıları ve Süreç Bileşenleri</h3></div>
      ${cikti.length?cikti.map(c=>`<div class="outcome"><span class="chip alan code" style="--ac:${ALAN[outAlan(c)]?.c||'var(--accent)'}">${c}</span><span>${esc(outText(c))}</span></div>`).join(''):'<span class="muted small">Etkinlik eklendiğinde otomatik dolar.</span>'}</div>
    <div class="sec"><div class="sec-title"><span class="num">6</span><h3>İçerik Çerçevesi</h3></div>
      <dl class="kv"><dt>Kavramlar</dt><dd><div class="chips">${list('kavram').map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'—'}</div></dd>
      <dt>Sözcükler</dt><dd><div class="chips">${list('sozcuk').map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'—'}</div></dd>
      <dt>Materyaller</dt><dd><div class="chips">${mats.map(m=>`<span class="chip">${em(m[1])} ${esc(m[0])}</span>`).join('')||'—'}</div></dd>
      <dt>Eğitim/öğrenme ortamları</dt><dd><input type="text" id="d-ortam" data-bind="day.ortamlar" value="${esc(p.ortamlar)}"></dd></dl></div>
    <div class="sec"><div class="sec-title"><span class="num">7</span><h3>Öğrenme-Öğretme Uygulamaları · Günlük Akış</h3></div><div class="flow">${flowHTML}</div></div>
    <div class="sec"><div class="sec-title"><span class="num">8</span><h3>Farklılaştırma</h3></div>
      <dl class="kv"><dt>Destekleme</dt><dd>${acts.map(a=>`<p class="small"><b>${esc(a.ad)}:</b> ${esc(a.destek)}</p>`).join('')||'—'}</dd>
      <dt>Zenginleştirme</dt><dd>${acts.map(a=>`<p class="small"><b>${esc(a.ad)}:</b> ${esc(a.zengin)}</p>`).join('')||'—'}</dd></dl></div>
    <div class="sec"><div class="sec-title"><span class="num">9</span><h3>Aile ve Toplum Katılımı</h3></div>${uniq(acts.map(a=>a.aile)).map(x=>`<p class="small">🏠 ${esc(x)}</p>`).join('')}<textarea id="d-aile" data-bind="day.aileEk" placeholder="Ek aile katılımı notu…">${esc(p.aileEk)}</textarea></div>
    <div class="sec"><div class="sec-title"><span class="num">10</span><h3>Değerlendirme</h3></div>
      <dl class="kv"><dt>Değerlendirme soruları</dt><dd><ul style="margin:0;padding-left:1.2em">${acts.flatMap(a=>a.soru.slice(0,2)).map(s=>`<li>${esc(s)}</li>`).join('')||'—'}</ul></dd>
      <dt>Öğrenme kanıtları</dt><dd><input type="text" id="d-kanit" data-bind="day.kanit" value="${esc(p.kanit)}"></dd>
      <dt>Gün sonu notu</dt><dd><textarea id="d-deg" data-bind="day.degNot" placeholder="Çocukların ilgisi, ulaşılan çıktılar, programın uygulanması ve öğretmen öz değerlendirmesi…">${esc(p.degNot)}</textarea></dd></dl></div>
  </section>`;
}
function planAct(a,i,n){
  const A=ALAN[a.alan];
  return `<div class="plan-act" style="--ac:${A.c}"><div class="plan-act-head"><div class="plan-act-em">${a.gorsel.map(em).join('')}</div>
    <div style="min-width:0"><h4>${esc(a.ad)}</h4><div class="mini-row small muted">${A.em} ${A.ad} · ${esc(a.tur)} · ⏱ ${esc(a.sure)}</div></div>
    <div class="no-print" style="display:flex;gap:2px"><button class="icon-btn" data-do="up" data-id="${a.id}" ${i===0?'disabled':''} aria-label="Yukarı taşı">▲</button><button class="icon-btn" data-do="down" data-id="${a.id}" ${i===n-1?'disabled':''} aria-label="Aşağı taşı">▼</button></div></div>
    <div class="plan-act-body"><p><b>Dikkat çekme:</b> ${esc(a.giris)}</p><ol>${a.adim.map(s=>`<li style="white-space:pre-line">${esc(s)}</li>`).join('')}</ol>

    <div class="toolbar no-print"><button class="btn sm" data-do="detail" data-ctx="plan" data-id="${a.id}">Düzenle</button><button class="btn sm" data-do="swap" data-id="${a.id}">Başka fikir</button><button class="btn sm" data-do="save" data-ctx="plan" data-id="${a.id}">Bankaya kaydet</button><button class="btn sm ghost danger" data-do="rm" data-id="${a.id}">Çıkar</button></div></div></div>`;
}

      <label class="field"><span>Ortam</span><select id="g-ortam">${['Sınıf','Salon / bahçe','Açık hava'].map(y=>`<option ${y===g.ortam?'selected':''}>${y}</option>`).join('')}</select></label>
      <label class="field"><span>Adet</span><select id="g-adet">${[3,6,9,12].map(n=>`<option ${n==g.adet?'selected':''}>${n}</option>`).join('')}</select></label>

    <div id="reset-confirm"></div>
  </section>
  <section class="panel" style="display:grid;gap:12px">
    <h2>Öğrenme çıktıları listesi</h2>
    <p class="note">Kodlar ve ifadeler Türkiye Yüzyılı Maarif Modeli Okul Öncesi Eğitim Programı'nın yapısına göre hazırlanmış kısa bir çalışma listesidir. Resmî program metniyle karşılaştırıp burada düzenleyebilir, yeni çıktı ekleyebilirsiniz. Değişiklikler tüm planlara yansır.</p>
    <div class="tbl-wrap"><table class="otbl"><tbody>${outcomes().map((o,i)=>`<tr><td style="width:110px"><input type="text" id="oc-${i}" data-oi="${i}" data-of="0" value="${esc(o[0])}"></td><td style="width:150px"><select id="oa-${i}" data-oi="${i}" data-of="1">${ALAN_KEYS.map(a=>`<option value="${a}" ${a===o[1]?'selected':''}>${ALAN[a].ad}</option>`).join('')}</select></td><td><input type="text" id="ot-${i}" data-oi="${i}" data-of="2" value="${esc(o[2])}"></td></tr>`).join('')}</tbody></table></div>
    <div class="toolbar"><button class="btn" data-do="oadd">${IC.plus} Yeni çıktı ekle</button><button class="btn ghost" data-do="oreset">Varsayılan listeye dön</button></div>
  </section>`;
}

/* ---------- Modal ---------- */
function modal(html){ $('#modal-root').innerHTML=`<div class="modal-bg" data-do="mclose"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $('#modal-root').innerHTML=''; }
function findAct(ctx,id){
  if(ctx==='gen') return S.gen.find(a=>a.id===id);
  if(ctx==='bank') return S.bank.find(a=>a.id===id);
  if(ctx==='plan') {for(const k in S.daily){const a=S.daily[k].acts.find(x=>x.id===id);if(a)return a}}
  return null;
}
function detailModal(a,ctx){
  const A=ALAN[a.alan]; const ed=ctx==='plan'||ctx==='bank';
  const ce=ed?'contenteditable="true"':'';
  modal(`<div class="modal-head"><div><span class="label">${A.em} ${A.ad} · ${esc(a.tur)}</span><h2 ${ce} data-ef="ad">${esc(a.ad)}</h2></div><button class="icon-btn" data-do="mclose" aria-label="Kapat">✕</button></div>
  <div class="modal-body" style="--ac:${A.c}">
    <div class="act-vis detail-vis"><span>${em(a.gorsel[0])}</span><span>${em(a.gorsel[1])}</span><span>${em(a.gorsel[2])}</span></div>
    <div class="act-meta"><span>⏱ ${esc(a.sure)}</span><span>👧 ${esc(a.yas)}</span><span>📍 ${esc(a.ortam)}</span><span>🎨 ${esc(a.temaAd)}</span></div>
    ${ed?'<p class="note">Metinlere dokunarak düzenleyebilirsiniz; değişiklikler "Kaydet" ile saklanır.</p>':''}
    <div><span class="label">Materyaller</span><div class="chips" style="margin-top:6px">${a.mat.map(m=>`<span class="chip">${em(m[1])} ${esc(m[0])}</span>`).join('')}</div></div>
    <div><span class="label">Dikkat çekme</span><p ${ce} data-ef="giris">${esc(a.giris)}</p></div>
    <div><span class="label">Uygulama adımları</span><ol style="margin:6px 0 0;padding-left:1.3em;display:grid;gap:6px">${a.adim.map((s,i)=>`<li ${ce} data-ef="adim" data-i="${i}" style="white-space:pre-line">${esc(s)}</li>`).join('')}</ol></div>
    <div><span class="label">Değerlendirme soruları</span><ul style="margin:6px 0 0;padding-left:1.3em">${a.soru.map((s,i)=>`<li ${ce} data-ef="soru" data-i="${i}">${esc(s)}</li>`).join('')}</ul></div>
    <dl class="kv"><dt>Öğrenme çıktıları</dt><dd>${a.cikti.map(c=>`<div class="outcome small"><b>${c}</b><span>${esc(outText(c))}</span></div>`).join('')}</dd>
      <dt>Kavramsal beceriler</dt><dd><div class="chips">${a.kb.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></dd>
      <dt>Eğilimler</dt><dd><div class="chips">${a.eg.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></dd>
      <dt>SDÖ becerileri</dt><dd><div class="chips">${a.sdb.map(x=>`<span class="chip">${esc((SDB.find(s=>s[0]===x)||[x,''] ).join(' '))}</span>`).join('')||'—'}</div></dd>
      <dt>Değerler</dt><dd><div class="chips">${a.dg.map(x=>`<span class="chip">💛 ${esc(x)}</span>`).join('')}</div></dd>
      <dt>Okuryazarlık</dt><dd><div class="chips">${a.ob.map(x=>`<span class="chip">${esc((OB.find(s=>s[0]===x)||[x,'']).join(' '))}</span>`).join('')||'—'}</div></dd>
      <dt>Kavramlar / Sözcükler</dt><dd>${esc(a.kavram.join(', '))} · <i>${esc(a.sozcuk.join(', '))}</i></dd>
      <dt>Destekleme</dt><dd ${ce} data-ef="destek">${esc(a.destek)}</dd>
      <dt>Zenginleştirme</dt><dd ${ce} data-ef="zengin">${esc(a.zengin)}</dd>
      <dt>Aile katılımı</dt><dd ${ce} data-ef="aile">${esc(a.aile)}</dd></dl>
    <div class="toolbar">${ed?`<button class="btn primary" data-do="msave" data-ctx="${ctx}" data-id="${a.id}">Kaydet</button>`:''}${ctx!=='plan'?`<button class="btn ${ed?'':'primary'}" data-do="addplan" data-ctx="${ctx}" data-id="${a.id}">${IC.plus} Plana ekle</button>`:''}${ctx==='gen'?`<button class="btn" data-do="save" data-ctx="gen" data-id="${a.id}">Bankaya kaydet</button>`:''}<button class="btn ghost" data-do="mclose">Kapat</button></div>
  </div>`);
}
function addPlanModal(ctx,id){
  const a=findAct(ctx,id);
  modal(`<div class="modal-head"><h2>Plana ekle</h2><button class="icon-btn" data-do="mclose" aria-label="Kapat">✕</button></div>
  <div class="modal-body"><p><b>${esc(a.ad)}</b> etkinliğini hangi günün planına eklemek istersiniz?</p>
  <label class="field"><span>Tarih</span><input type="date" id="ap-date" value="${S.ui.day}"></label>
  <div class="toolbar"><button class="btn primary" data-do="apgo" data-ctx="${ctx}" data-id="${id}">Ekle</button><button class="btn" data-do="apgo" data-ctx="${ctx}" data-id="${id}" data-open="1">Ekle ve planı aç</button><button class="btn ghost" data-do="mclose">Vazgeç</button></div></div>`);
}
function bankModal(){
  modal(`<div class="modal-head"><h2>Bankadan etkinlik ekle</h2><button class="icon-btn" data-do="mclose" aria-label="Kapat">✕</button></div>
  <div class="modal-body">${S.bank.length?S.bank.map(a=>`<div class="plan-act" style="--ac:${ALAN[a.alan].c}"><div class="plan-act-head"><div class="plan-act-em">${a.gorsel.map(em).join('')}</div><div style="min-width:0"><h4>${esc(a.ad)}</h4><div class="small muted">${ALAN[a.alan].ad} · ${esc(a.temaAd)}</div></div><button class="btn sm primary" data-do="bpick" data-id="${a.id}">Ekle</button></div></div>`).join(''):'<div class="empty"><div class="em">📦</div><b>Bankanız boş</b><span class="small">Etkinlik üreticiden kaydettiğiniz etkinlikler burada görünür.</span></div>'}</div>`);
}
function editMonthModal(i){
  const m=S.year[i]; const [y,mm]=m.key.split('-').map(Number);
  const tOpts=sel=>TEMA_KEYS.map(t=>`<option value="${t}" ${t===sel?'selected':''}>${esc(TEMA[t].ad)}</option>`).join('');
  modal(`<div class="modal-head"><h2>${AYLAR[mm-1]} ${y}</h2><button class="icon-btn" data-do="mclose" aria-label="Kapat">✕</button></div>
  <div class="modal-body">
    <label class="field"><span>Ayın teması</span><input type="text" id="em-b" value="${esc(m.baslik)}"></label>
    <label class="field"><span>Kısa açıklama</span><input type="text" id="em-o" value="${esc(m.ozet)}"></label>
    <div style="display:grid;gap:8px"><span class="label">Haftalar</span>${m.weeks.map((w,j)=>`<div class="grid g2" style="gap:8px"><input type="text" id="em-wb${j}" value="${esc(w.baslik)}" aria-label="${j+1}. hafta başlığı"><select id="em-wt${j}" aria-label="${j+1}. hafta teması">${tOpts(w.tema)}</select></div>`).join('')}
      <div class="toolbar"><button class="btn sm" data-do="emaddw" data-i="${i}">${IC.plus} Hafta ekle</button>${m.weeks.length>1?`<button class="btn sm ghost" data-do="emdelw" data-i="${i}">Son haftayı sil</button>`:''}</div></div>
    <label class="field"><span>Belirli gün ve haftalar (her satıra bir tane)</span><textarea id="em-g">${esc(m.gunler.join('\n'))}</textarea></label>
    <div><span class="label">Öne çıkan değerler</span><div class="chips" style="margin-top:6px">${DEGER.map(d=>`<button class="chip" data-do="emdeg" data-v="${esc(d)}" aria-pressed="${m.deger.includes(d)}">${esc(d)}</button>`).join('')}</div></div>
    <div><span class="label">Odak alanlar</span><div class="chips" style="margin-top:6px">${ALAN_KEYS.map(a=>`<button class="chip" data-do="emodak" data-v="${a}" aria-pressed="${m.odak.includes(a)}">${ALAN[a].em} ${ALAN[a].ad}</button>`).join('')}</div></div>
    <div class="toolbar"><button class="btn primary" data-do="emsave" data-i="${i}">Kaydet</button><button class="btn ghost" data-do="mclose">Vazgeç</button></div>
  </div>`);
}
function readMonthForm(i){
  const m=S.year[i]; m.baslik=$('#em-b').value; m.ozet=$('#em-o').value;
  m.weeks=m.weeks.map((w,j)=>({baslik:$('#em-wb'+j).value,tema:$('#em-wt'+j).value}));
  m.gunler=$('#em-g').value.split('\n').map(s=>s.trim()).filter(Boolean);
}

let toastT;
function toast(msg){clearTimeout(toastT);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;toastT=setTimeout(()=>el.remove(),2600)}

/* ---------- Çizim ---------- */
const VIEWS={home:vHome,year:vYear,month:vMonth,day:vDay,gen:vGen,bank:vBank,set:vSet};
function render(keepScroll){
  const y=window.scrollY; renderNav(); $('#view').innerHTML=VIEWS[S.ui.view](); if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}
function go(v){S.ui.view=v;save();render();}

/* ---------- Olaylar ---------- */
function addToDay(k,a){const p=getDay(k);p.acts.push({...a,id:uid()});save();}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){closeModal();go(g.dataset.go);return}
  const b=e.target.closest('[data-do]'); if(!b) return;
  const d=b.dataset.do;
  if(d==='mclose'){ if(b.classList.contains('modal-bg')&&e.target!==b) return; closeModal(); return; }
  const id=b.dataset.id, ctx=b.dataset.ctx;
  const day=()=>getDay(S.ui.day);
  switch(d){
    case 'print': window.print(); break;
    case 'detail': {const a=findAct(ctx,id); if(a) detailModal(a,ctx); break;}
    case 'save': {const a=findAct(ctx,id); if(a){S.bank.unshift({...a,id:uid()});save();toast('Etkinlik bankaya kaydedildi');} break;}
    case 'saveall': S.gen.forEach(a=>S.bank.unshift({...a,id:uid()})); save(); toast(`${S.gen.length} etkinlik bankaya kaydedildi`); break;
    case 'del': S.bank=S.bank.filter(a=>a.id!==id); save(); render(true); toast('Etkinlik silindi'); break;
    case 'regen': {const i=S.gen.findIndex(a=>a.id===id); const a=S.gen[i]; S.gen[i]=generate({alan:a.alan,tema:a.tema,yas:a.yas,ortam:a.ortam,avoid:[a.tpl]}); save(); render(true); break;}
    case 'addplan': addPlanModal(ctx,id); break;
    case 'apgo': {const a=findAct(ctx,id); const k=$('#ap-date').value; if(!k){toast('Lütfen bir tarih seçin');break;} addToDay(k,a); closeModal(); toast(`${fmtShort(k)} planına eklendi`); if(b.dataset.open){S.ui.day=k;go('day');} break;}
    case 'galan': S.ui.gen.alan=b.dataset.v; save(); render(true); break;
    case 'generate': case 'genmore': {
      const g=S.ui.gen; g.tema=$('#g-tema').value; g.yas=$('#g-yas').value; g.ortam=$('#g-ortam').value; g.adet=+$('#g-adet').value;
      const list=[]; const used=[];
      for(let i=0;i<g.adet;i++){const al=g.alan==='KARMA'?ALAN_KEYS[(i+Math.floor(Math.random()*7))%7]:g.alan; const a=generate({alan:al,tema:g.tema,yas:g.yas,ortam:g.ortam,avoid:used}); used.push(a.tpl); list.push(a);}
      S.gen = d==='genmore' ? [...S.gen,...list] : list; save(); render(true); toast(`${list.length} yeni etkinlik üretildi`); break;}
    case 'genclear': S.gen=[]; save(); render(true); break;
    case 'genfor': S.ui.gen.tema=b.dataset.tema; S.gen=Array.from({length:6},(_,i)=>generate({alan:ALAN_KEYS[i%7],tema:b.dataset.tema})); go('gen'); break;
    case 'bf': S.ui.bankF=b.dataset.v; render(true); break;
    case 'openmonth': S.ui.month=b.dataset.key; go('month'); break;
    case 'openday': S.ui.day=b.dataset.key; go('day'); break;
    case 'editmonth': editMonthModal(+b.dataset.i); break;
    case 'emdeg': case 'emodak': {const m=S.year[+$('[data-do="emsave"]').dataset.i]; const f=d==='emdeg'?'deger':'odak'; const v=b.dataset.v; m[f]=m[f].includes(v)?m[f].filter(x=>x!==v):[...m[f],v]; b.setAttribute('aria-pressed',m[f].includes(v)); break;}
    case 'emaddw': {const i=+b.dataset.i; readMonthForm(i); S.year[i].weeks.push({baslik:'Yeni hafta',tema:'okul'}); editMonthModal(i); break;}
    case 'emdelw': {const i=+b.dataset.i; readMonthForm(i); S.year[i].weeks.pop(); editMonthModal(i); break;}
    case 'emsave': {const i=+b.dataset.i; readMonthForm(i); delete S.monthly[S.year[i].key]; save(); closeModal(); render(true); toast('Ay planı güncellendi'); break;}
    case 'resetyear': S.year=yearTemplate(S.settings.baslangic); S.monthly={}; save(); render(true); toast('Yıllık plan varsayılan temalara döndü'); break;
    case 'tog': {const M=getMonth(S.ui.month); const f=b.dataset.f, v=b.dataset.v; M.sel[f]=M.sel[f].includes(v)?M.sel[f].filter(x=>x!==v):[...M.sel[f],v]; save(); render(true); break;}
    case 'fillmonth': {const [y,mm]=S.ui.month.split('-').map(Number); let n=0; for(let dd=1;dd<=new Date(y,mm,0).getDate();dd++){const dt=new Date(y,mm-1,dd); if(dt.getDay()===0||dt.getDay()===6) continue; const k=dkey(dt); if(!S.daily[k]||!S.daily[k].acts.length){S.daily[k]=newDay(k,true);n++;}} save(); render(true); toast(n?`${n} iş gününe plan oluşturuldu`:'Tüm iş günlerinde zaten plan var'); break;}
    case 'dayshift': {const dt=pdate(S.ui.day); dt.setDate(dt.getDate()+(+b.dataset.n)); S.ui.day=dkey(dt); save(); render(); break;}
    case 'autoday': {const k=S.ui.day; const old=S.daily[k]; const nd=newDay(k,true); if(old&&old.degNot) nd.degNot=old.degNot; S.daily[k]=nd; save(); if(S.ui.view!=='day'){go('day')}else render(true); toast('Plan haftanın temasına göre oluşturuldu'); break;}
    case 'clearday': delete S.daily[S.ui.day]; save(); render(true); toast('Günün planı temizlendi'); break;
    case 'addnew': {const p=day(); const used=p.acts.map(a=>a.alan); const free=ALAN_KEYS.filter(a=>!used.includes(a)); p.acts.push(generate({alan:rnd(free.length?free:ALAN_KEYS),tema:p.tema})); save(); render(true); toast('Yeni etkinlik eklendi'); break;}
    case 'frombank': bankModal(); break;
    case 'bpick': {const a=S.bank.find(x=>x.id===id); addToDay(S.ui.day,a); closeModal(); render(true); toast('Etkinlik plana eklendi'); break;}
    case 'up': case 'down': {const p=day(); const i=p.acts.findIndex(a=>a.id===id); const j=d==='up'?i-1:i+1; if(j<0||j>=p.acts.length)break; [p.acts[i],p.acts[j]]=[p.acts[j],p.acts[i]]; save(); render(true); break;}
    case 'rm': {const p=day(); p.acts=p.acts.filter(a=>a.id!==id); save(); render(true); break;}
    case 'swap': {const p=day(); const i=p.acts.findIndex(a=>a.id===id); const a=p.acts[i]; p.acts[i]=generate({alan:a.alan,tema:p.tema,yas:a.yas,ortam:a.ortam,avoid:[a.tpl]}); save(); render(true); toast('Etkinlik başka bir fikirle değiştirildi'); break;}
    case 'msave': {const a=findAct(ctx,id); const box=$('.modal');
      box.querySelectorAll('[data-ef]').forEach(el=>{const f=el.dataset.ef; const v=el.innerText.trim(); if(el.dataset.i!==undefined){a[f][+el.dataset.i]=v}else a[f]=v;});
      save(); closeModal(); render(true); toast('Etkinlik kaydedildi'); break;}
    case 'exp': {const t=$('#s-json'); t.value=JSON.stringify(S); t.select(); try{navigator.clipboard.writeText(t.value).then(()=>toast('Veriler panoya kopyalandı'),()=>toast('Veriler seçildi; kopyalamak için Ctrl+C'))}catch(err){toast('Veriler seçildi; kopyalamak için Ctrl+C')} break;}
    case 'dl': {const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download=`minik-adimlar-yedek-${dkey(new Date())}.json`; l.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); break;}
    case 'imp': {try{const o=JSON.parse($('#s-json').value); if(!o.year||!o.settings) throw 0; S=o; save(); render(); toast('Veriler geri yüklendi');}catch(err){toast('Yedek okunamadı: kutudaki metin bu uygulamanın yedeği olmalı');} break;}
    case 'reset': $('#reset-confirm').innerHTML='<div class="note" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">Tüm planlar ve banka silinecek. Emin misiniz? <button class="btn sm danger" data-do="reset2">Evet, sıfırla</button><button class="btn sm ghost" data-do="reset0">Vazgeç</button></div>'; break;
    case 'reset0': $('#reset-confirm').innerHTML=''; break;
    case 'reset2': try{localStorage.removeItem(KEY)}catch(err){} seed(); save(); render(); toast('Uygulama sıfırlandı'); break;
    case 'oadd': S.outcomes=outcomes().slice(); S.outcomes.push(['YENİ.1','TA','Yeni öğrenme çıktısı']); save(); render(true); break;
    case 'oreset': delete S.outcomes; save(); render(true); toast('Varsayılan çıktı listesi yüklendi'); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target; const bind=t.dataset.bind;
  if(bind){const [scope,...path]=bind.split('.'); let obj= scope==='day'?getDay(S.ui.day): scope==='month'?getMonth(S.ui.month): S.settings;
    for(let i=0;i<path.length-1;i++) obj=obj[path[i]]; obj[path[path.length-1]]=t.value; save(); if(scope==='set') renderNav(); return;}
  if(t.dataset.oi!==undefined){S.outcomes=outcomes().map(o=>o.slice()); S.outcomes[+t.dataset.oi][+t.dataset.of]=t.value; save(); return;}
  if(t.id==='bq'){S.ui.bankQ=t.value; const pos=t.selectionStart; render(true); const n=$('#bq'); n.focus(); n.setSelectionRange(pos,pos);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='msel'){S.ui.month=t.value;save();render();}
  else if(t.id==='dsel'&&t.value){S.ui.day=t.value;save();render();}
  else if(t.id==='dtema'){const p=getDay(S.ui.day);p.tema=t.value;p.haftaBaslik=TEMA[t.value].ad;save();render(true);}
  else if(t.id==='g-tema'){S.ui.gen.tema=t.value;save();}
  else if(t.id==='s-yas'){S.settings.yas=t.value;S.ui.gen.yas=t.value;save();renderNav();}
  else if(t.id==='s-yil'){const y=+t.value; if(y!==S.settings.baslangic){S.settings.baslangic=y;S.year=yearTemplate(y);S.monthly={};save();render(true);toast(`${y}-${y+1} yılı temaları yüklendi`);}}
  else if(t.id==='s-file'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#s-json').value=r.result;toast('Dosya okundu; "Geri yükle"ye dokunun')};r.readAsText(t.files[0]);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- Başlat ---------- */
S = load() || seed(); save();
const h=(location.hash||'').slice(1); if(VIEWS[h]) S.ui.view=h;
render();
</script>
</body>
</html>
