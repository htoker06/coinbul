{% extends "base.html" %}
{% block baslik %}Giriş{% endblock %}
{% block icerik %}
<div class="giris-kutu kart">
  <h1>{{ okul_adi }}</h1>
  <p class="alt">Faaliyet Ücreti Takip Programı</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Kullanıcı adı</label>
    <input type="text" name="kullanici_adi" required autofocus>
    <label>Şifre</label>
    <input type="password" name="sifre" required>
    <p><button class="btn">Giriş yap</button></p>
  </form>
</div>
{% endblock %}
